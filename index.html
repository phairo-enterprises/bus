<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="viewport" content="width=device-width, initial-scale-1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lil-gui/0.17.0/lil-gui.umd.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; touch-action: none; cursor: grab; }
        canvas.grabbing { cursor: grabbing; }
        canvas.freecam-active { cursor: crosshair; }
        #loadButton {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px; font-family: monospace; font-size: 20px;
            color: white; background-color: transparent; border: 1px solid white;
            cursor: pointer; z-index: 100; transition: opacity 0.5s;
        }
        #loadButton:hover { background-color: rgba(255, 255, 255, 0.1); }
        #warningOverlay {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background-color: rgba(255, 0, 0, 0.1);
            color: rgba(255, 100, 100, 0.5); font-family: monospace; font-size: 6vw;
            text-align: center; padding-top: 40vh; box-sizing: border-box;
            transform: rotate(-15deg) scale(1.5); text-shadow: 0 0 5px #FF0000;
            z-index: 10;
        }
    </style>
</head>
<body>
    <button id="loadButton">// ENGAGE FaiL PROTOCOLS //</button>
    <div id="warningOverlay">// PROTOCOL UNSTABLE // ADAPTING //</div>
    <script>
        // --- STABLE FOUNDATION v11.0 (FINAL INTEGRATION & BOOT SEQUENCE) ---

        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialiased: true });
        const BASE_FOV = 75;
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
        const clock = new THREE.Clock();
        
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 5;

        const artifactGroup = new THREE.Group();
        scene.add(artifactGroup);
        const bodyMaterial = new THREE.MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.1 });
        const cubeBody = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), bodyMaterial);
        artifactGroup.add(cubeBody);
        const cubeWireframe = new THREE.LineSegments(new THREE.EdgesGeometry(cubeBody.geometry), new THREE.LineBasicMaterial({ color: 0xFFFFFF }));
        artifactGroup.add(cubeWireframe);

        const params = { damping: 0.95 };
        const uiGroup = new THREE.Group();
        let advancedProtocolsLoaded = false;
        let gui;

        const ambientLight = new THREE.AmbientLight(0x404080, 2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00FFFF, 1.5, 50);
        artifactGroup.add(pointLight);

        const caveGeometry = new THREE.BufferGeometry();
        const caveVertices = [];
        const radius = 20, depth = 50, segments = 12;
        for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            caveVertices.push(Math.cos(angle)*radius*(1+Math.random()*0.2), Math.sin(angle)*radius*(1+Math.random()*0.2), -depth/2 + (Math.random()-0.5)*5);
            caveVertices.push(Math.cos(angle)*radius*(1+Math.random()*0.2), Math.sin(angle)*radius*(1+Math.random()*0.2), depth/2 + (Math.random()-0.5)*5);
        }
        caveVertices.push(0, 0, depth / 2);
        const backCenterIndex = caveVertices.length / 3 - 1;
        const caveIndices = [];
        for (let i = 0; i < segments; i++) {
            const current = i * 2;
            const next = ((i + 1) % segments) * 2;
            caveIndices.push(current, current + 1, next);
            caveIndices.push(next, current + 1, next + 1);
            caveIndices.push(next + 1, current + 1, backCenterIndex);
        }
        caveGeometry.setIndex(caveIndices);
        caveGeometry.setAttribute('position', new THREE.Float32BufferAttribute(caveVertices, 3));
        caveGeometry.computeVertexNormals();
        const caveMaterial = new THREE.MeshStandardMaterial({ color: 0x223366, flatShading: true, side: THREE.BackSide });
        const cave = new THREE.Mesh(caveGeometry, caveMaterial);
        scene.add(cave);

        function logStatus(message, isSuccess = true) {
            const color = isSuccess ? 'lightgreen' : 'red';
            console.log(`%c[PHAIRO OS] ${message}`, `color: ${color}; font-weight: bold;`);
        }

        function engageProtocols() {
            const loadButton = document.getElementById('loadButton');
            loadButton.style.opacity = '0';
            setTimeout(() => loadButton.remove(), 500);

            setTimeout(() => logStatus("Boot sequence initiated..."), 100);

            setTimeout(() => {
                bodyMaterial.color.set(0xFF0000);
                pointLight.color.set(0xFF0000);
                logStatus("Artifact state... ENGAGED");
            }, 500);

            setTimeout(() => {
                Object.assign(params, {
                    scale: 1.0, lightIntensity: 1.5, color: '#ff0000', freecam: false, freecamSpeed: 5.0,
                });
                gui = new lil.GUI();
                const artifactFolder = gui.addFolder('Artifact Controls');
                artifactFolder.add(params, 'scale', 0.2, 2.5).onChange(v => artifactGroup.scale.set(v, v, v));
                artifactFolder.add(params, 'damping', 0.9, 0.995);
                artifactFolder.add(params, 'lightIntensity', 0, 4.0).onChange(v => pointLight.intensity = v);
                artifactFolder.addColor(params, 'color').onChange(v => { pointLight.color.set(v); bodyMaterial.color.set(v); });
                const cameraFolder = gui.addFolder('Camera Controls');
                cameraFolder.add(params, 'freecam').name('Freecam Mode').onChange(toggleFreecam);
                cameraFolder.add(camera, 'fov', 30, 120).name('Field of View').onChange(() => camera.updateProjectionMatrix());
                cameraFolder.add(params, 'freecamSpeed', 1, 20).name('Move Speed');
                logStatus("Control Interface... ONLINE");
            }, 1000);

            setTimeout(() => {
                activatePerformanceMonitor();
                logStatus("Cascading Reboot Protocol... ARMED");
            }, 1500);

            setTimeout(() => {
                activateFreecamSystem();
                logStatus("Freecam Protocol... STANDBY");
            }, 2000);
            
            setTimeout(() => {
                advancedProtocolsLoaded = true;
                logStatus("All systems nominal. Welcome, Architect.");
            }, 2500);
        }
        document.getElementById('loadButton').addEventListener('click', engageProtocols);

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let selectedObject = null;
        let isDragging = false;
        const previousPointerPosition = { x: 0, y: 0 };
        const rotationVelocity = { x: 0, y: 0 };
        const SENSITIVITY = 0.004;
        const keyState = {};
        const cameraDirection = new THREE.Vector3();
        
        let lastFrameTime, frameTimes, FPS_CHECK_INTERVAL, FPS_TARGET, frameCounter, isAdapting, adaptationLevel, ADAPTATION_STEPS, warningOverlay;

        function activatePerformanceMonitor() {
            lastFrameTime = performance.now();
            frameTimes = [];
            FPS_CHECK_INTERVAL = 120;
            FPS_TARGET = 30;
            frameCounter = 0;
            isAdapting = false;
            adaptationLevel = 0;
            ADAPTATION_STEPS = [1, 0.75, 0.5];
            warningOverlay = document.getElementById('warningOverlay');
        }

        function activateFreecamSystem() {
            document.addEventListener('keydown', (e) => keyState[e.code] = true);
            document.addEventListener('keyup', (e) => keyState[e.code] = false);
            renderer.domElement.addEventListener('mousemove', onFreecamMouseMove);
            document.addEventListener('pointerlockchange', () => {
                const isActive = document.pointerLockElement === renderer.domElement;
                if (advancedProtocolsLoaded) {
                    params.freecam = isActive;
                    renderer.domElement.classList.toggle('freecam-active', isActive);
                    if (gui) gui.controllers.forEach(c => { if(c.property === 'freecam') c.updateDisplay(); });
                }
            });
        }

        function onPointerDown(event) {
            if (advancedProtocolsLoaded && params.freecam) return;
            const clientX = event.clientX || event.touches[0].clientX;
            const clientY = event.clientY || event.touches[0].clientY;
            isDragging = true;
            renderer.domElement.classList.add('grabbing');
            previousPointerPosition.x = clientX;
            previousPointerPosition.y = clientY;
        }

        function onPointerMove(event) {
            if(event.touches && event.touches.length > 1) return;
            event.preventDefault();
            if (isDragging && (!advancedProtocolsLoaded || !params.freecam)) {
                const clientX = event.clientX || (event.touches && event.touches[0] ? event.touches[0].clientX : previousPointerPosition.x);
                const clientY = event.clientY || (event.touches && event.touches[0] ? event.touches[0].clientY : previousPointerPosition.y);
                const deltaX = clientX - previousPointerPosition.x;
                const deltaY = clientY - previousPointerPosition.y;
                rotationVelocity.y += deltaX * SENSITIVITY;
                rotationVelocity.x += deltaY * SENSITIVITY;
                previousPointerPosition.x = clientX;
                previousPointerPosition.y = clientY;
            }
        }

        function onPointerUp() { 
            isDragging = false; 
            renderer.domElement.classList.remove('grabbing');
        }

        function toggleFreecam(value) {
            if (value) renderer.domElement.requestPointerLock();
            else document.exitPointerLock();
        }
        
        function onFreecamMouseMove(event) {
            if (advancedProtocolsLoaded && params.freecam) {
                camera.rotation.y -= event.movementX * 0.002;
