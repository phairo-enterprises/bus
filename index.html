<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
            touch-action: none;
            cursor: grab;
        }
        canvas.grabbing {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <script>
        // --- STABLE FOUNDATION v5.0 (VERBATIM RESTORATION) ---

        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialiased: true });
        const BASE_FOV = 75;
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const clock = new THREE.Clock();

        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const edges = new THREE.EdgesGeometry(geometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xFFFFFF });
        const cube = new THREE.LineSegments(edges, lineMaterial);
        scene.add(cube);

        let isDragging = false;
        const previousPointerPosition = { x: 0, y: 0 };
        const rotationVelocity = { x: 0, y: 0 };
        const DAMPING_FACTOR = 0.95;
        const SENSITIVITY = 0.01;

        function onPointerDown(event) {
            isDragging = true;
            renderer.domElement.classList.add('grabbing');
            previousPointerPosition.x = event.clientX || event.touches[0].clientX;
            previousPointerPosition.y = event.clientY || event.touches[0].clientY;
        }
        function onPointerMove(event) {
            if(event.touches && event.touches.length > 1) return;
            event.preventDefault();
            if (isDragging) {
                const clientX = event.clientX || event.touches[0].clientX;
                const clientY = event.clientY || event.touches[0].clientY;
                const deltaX = clientX - previousPointerPosition.x;
                const deltaY = clientY - previousPointerPosition.y;
                rotationVelocity.y += deltaX * SENSITIVITY;
                rotationVelocity.x += deltaY * SENSITIVITY;
                previousPointerPosition.x = clientX;
                previousPointerPosition.y = clientY;
            }
        }
        function onPointerUp() { 
            isDragging = false; 
            renderer.domElement.classList.remove('grabbing');
        }

        renderer.domElement.addEventListener('mousedown', onPointerDown);
        renderer.domElement.addEventListener('mousemove', onPointerMove);
        renderer.domElement.addEventListener('mouseup', onPointerUp);
        renderer.domElement.addEventListener('mouseleave', onPointerUp);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: false });
        renderer.domElement.addEventListener('touchmove', onPointerMove, { passive: false });
        renderer.domElement.addEventListener('touchend', onPointerUp);
        
        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const aspect = width / height;
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            camera.aspect = aspect;
            if (aspect < 1) {
                const horizontalFovInRadians = BASE_FOV * Math.PI / 180;
                camera.fov = 2 * Math.atan(Math.tan(horizontalFovInRadians / 2) / aspect) * 180 / Math.PI;
            } else {
                camera.fov = BASE_FOV;
            }
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', onWindowResize);
        
        function animate() {
            requestAnimationFrame(animate);
            
            cube.rotation.x += rotationVelocity.x;
            cube.rotation.y += rotationVelocity.y;
            if (!isDragging) {
                rotationVelocity.x *= DAMPING_FACTOR;
                rotationVelocity.y *= DAMPING_FACTOR;
            }
            
            renderer.render(scene, camera);
        }

        onWindowResize();
        animate();
    </script>
</body>
</html>
