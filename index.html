<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            cursor: none;
        }
        canvas {
            display: block;
        }
        #warningOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.1);
            color: rgba(255, 100, 100, 0.5);
            font-family: monospace;
            font-size: 6vw;
            text-align: center;
            padding-top: 40vh;
            box-sizing: border-box;
            transform: rotate(-15deg) scale(1.5);
            text-shadow: 0 0 5px #FF0000;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="warningOverlay">// PROTOCOL UNSTABLE // ADAPTING //</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- STABLE FOUNDATION v3.3 (FINAL, UNIFIED CODE) ---

        // --- 1. CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialiased: true });
        const BASE_FOV = 75;
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;

        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const clock = new THREE.Clock();
        const warningOverlay = document.getElementById('warningOverlay');

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x404080, 2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xFFFFFF, 1.5, 50);
        scene.add(pointLight);

        // --- 3. CENTRAL ARTIFACT ---
        const cubeGeometry = new THREE.BoxGeometry(2, 2, 2);
        const edges = new THREE.EdgesGeometry(cubeGeometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xFFFFFF });
        const cube = new THREE.LineSegments(edges, lineMaterial);
        cube.add(pointLight);
        scene.add(cube);

        // --- 4. ICE CAVE ENVIRONMENT ---
        const caveGeometry = new THREE.BufferGeometry();
        const vertices = [];
        const radius = 20, depth = 50, segments = 12;
        for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            vertices.push(
                Math.cos(angle) * radius * (1 + Math.random() * 0.2),
                Math.sin(angle) * radius * (1 + Math.random() * 0.2),
                -depth / 2 + (Math.random() - 0.5) * 5
            );
            vertices.push(
                Math.cos(angle) * radius * (1 + Math.random() * 0.2),
                Math.sin(angle) * radius * (1 + Math.random() * 0.2),
                depth / 2 + (Math.random() - 0.5) * 5
            );
        }
        vertices.push(0, 0, depth / 2);
        const backCenterIndex = vertices.length / 3 - 1;
        const indices = [];
        for (let i = 0; i < segments; i++) {
            const current = i * 2;
            const next = ((i + 1) % segments) * 2;
            indices.push(current, current + 1, next);
            indices.push(next, current + 1, next + 1);
            indices.push(next + 1, current + 1, backCenterIndex);
        }
        caveGeometry.setIndex(indices);
        caveGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        caveGeometry.computeVertexNormals();
        const caveMaterial = new THREE.MeshStandardMaterial({
            color: 0x223366,
            flatShading: true,
            side: THREE.BackSide
        });
        const cave = new THREE.Mesh(caveGeometry, caveMaterial);
        scene.add(cave);

        // --- 5. PERFORMANCE MONITORING & ADAPTATION ---
        let lastFrameTime = performance.now();
        const frameTimes = [];
        const FPS_CHECK_INTERVAL = 120;
        const FPS_TARGET = 30;
        let frameCounter = 0;
        let isAdapting = false;
        let adaptationLevel = 0;
        const ADAPTATION_STEPS = [1, 0.75, 0.5];

        function checkPerformanceAndAdapt() {
            if (isAdapting || adaptationLevel >= ADAPTATION_STEPS.length - 1) return;
            const averageDelta = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
            const currentFps = 1000 / averageDelta;
            if (currentFps < FPS_TARGET) {
                isAdapting = true;
                warningOverlay.style.display = 'block';
                setTimeout(() => {
                    adaptationLevel++;
                    const newPixelRatio = window.devicePixelRatio * ADAPTATION_STEPS[adaptationLevel];
                    renderer.setPixelRatio(newPixelRatio);
                    warningOverlay.style.display = 'none';
                    isAdapting = false;
                }, 2500);
            }
        }
        
        // --- 6. RESPONSIVE CONTROLS ---
        let isDragging = false;
        const previousPointerPosition = { x: 0, y: 0 };
        const rotationVelocity = { x: 0, y: 0 };
        const DAMPING_FACTOR = 0.95;
        const SENSITIVITY = 0.01;

        function onPointerDown(event) {
            isDragging = true;
            previousPointerPosition.x = event.clientX || event.touches[0].clientX;
            previousPointerPosition.y = event.clientY || event.touches[0].clientY;
        }
        function onPointerMove(event) {
            if (isDragging) {
                const clientX = event.clientX || event.touches[0].clientX;
                const clientY = event.clientY || event.touches[0].clientY;
                const deltaX = clientX - previousPointerPosition.x;
                const deltaY = clientY - previousPointerPosition.y;
                rotationVelocity.y += deltaX * SENSITIVITY;
                rotationVelocity.x += deltaY * SENSITIVITY;
                previousPointerPosition.x = clientX;
                previousPointerPosition.y = clientY;
            }
        }
        function onPointerUp() { isDragging = false; }

        renderer.domElement.addEventListener('mousedown', onPointerDown);
        renderer.domElement.addEventListener('mousemove', onPointerMove);
        renderer.domElement.addEventListener('mouseup', onPointerUp);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });
        renderer.domElement.addEventListener('touchmove', onPointerMove, { passive: true });
        renderer.domElement.addEventListener('touchend', onPointerUp);
        
        // --- 7. RESIZE & FOV HANDLER ---
        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const aspect = width / height;
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio * ADAPTATION_STEPS[adaptationLevel]);
            camera.aspect = aspect;
            if (aspect < 1) {
                const horizontalFovInRadians = BASE_FOV * Math.PI / 180;
                camera.fov = 2 * Math.atan(Math.tan(horizontalFovInRadians / 2) / aspect) * 180 / Math.PI;
            } else {
                camera.fov = BASE_FOV;
            }
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', onWindowResize);
        
        // --- 8. MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            
            // Performance Monitoring
            const now = performance.now();
            const deltaTime = now - lastFrameTime;
            lastFrameTime = now;
            frameTimes.push(deltaTime);
            if (frameTimes.length > 60) frameTimes.shift();
            if (++frameCounter >= FPS_CHECK_INTERVAL) {
                checkPerformanceAndAdapt();
                frameCounter = 0;
            }

            // Camera Animation
            camera.position.x = Math.sin(elapsedTime * 0.2) * 1.5;
            camera.position.y = Math.cos(elapsedTime * 0.3) * 1.0;
            camera.lookAt(scene.position);

            // Cube Animation
            cube.rotation.x += rotationVelocity.x;
            cube.rotation.y += rotationVelocity.y;
            if (!isDragging) {
                rotationVelocity.x *= DAMPING_FACTOR;
                rotationVelocity.y *= DAMPING_FACTOR;
            }
            
            renderer.render(scene, camera);
        }

        // --- 9. IGNITION ---
        onWindowResize();
        animate();
    </script>
</body>
</html>
