<!-- index.html - v0.09 retry -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BackupStrats TCG - v0.09</title>
    <link rel="stylesheet" href="style.css?v=c3dc2eab10836e06">
    <script>
    // Open the live guest game when its origin is serving this exact entry.
    // An unavailable origin or an arcade session already underway keeps the arcade open.
    (async function openGuestGame() {
        if (window.top !== window || location.hash || location.search) return;
        const pending = new AbortController();
        const cancel = () => pending.abort();
        const events = ['pointerdown', 'keydown', 'pagehide'];
        for (const event of events) window.addEventListener(event, cancel, {capture: true, once: true});
        const timeout = setTimeout(cancel, 2500);
        try {
            const entry = await fetch('/guest/', {
                method: 'HEAD', mode: 'same-origin', credentials: 'omit',
                redirect: 'error', cache: 'no-store', signal: pending.signal
            });
            if (!pending.signal.aborted && entry.status === 200 &&
                entry.headers.get('X-Hollow-Soul-Entry') === 'isolated-guest-v1') {
                location.replace('/guest/');
            }
        } catch {
            // The public arcade is already loading.
        } finally {
            clearTimeout(timeout);
            for (const event of events) window.removeEventListener(event, cancel, true);
        }
    })();
    </script>
</head>
<body>
    <canvas id="nexus-canvas"></canvas>
    <div id="shell-overlay">
        <div id="immersion-prompt" role="button" tabindex="0">// INITIATE IMMERSION //</div>

        <!-- The new static handle and the area for the future trackpad are forged. -->
        <div id="handle"></div>
        <div id="trackpad-area"></div>

        <!-- The original handle is repurposed as a temporary, draggable pointer. -->
        <div id="pointer-temp"></div>

        <div id="conduit"></div>
        <div id="keyboard"></div>
        <div id="recents-bar"></div>
        <div id="favorites-bar"></div>
    </div>

    <div id="warningOverlay">// PROTOCOL UNSTABLE // ADAPTING //</div>
    <div id="consoleContainer">
        <div id="tutorialStatus" role="status" aria-live="polite" style="padding:10px;display:none;border-bottom:1px solid rgba(0,255,0,.3)"></div>
        <div id="consoleOutput"></div>
    </div>
    <script src="main.js?v=c21f0c014d12eae9"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="reportSceneFailure()"></script>
    <script src="tutorial-progress.js?v=a6f1203becddc5d8"></script>
    <script src="qwerty-presentation.js?v=53d9707a8d928df8"></script>
    <script src="cave-controls.js?v=9caa59da95878d21"></script>
</body>
</html>
