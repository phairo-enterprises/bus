<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="author" content="Architect">
    <meta name="description" content="World">
    <style>
        /*
         * THE AESTHETICS OF THE VOID v2.4
         * The Vector Warning Protocol has been integrated.
        */
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #000000; color: #FFFFFF;
            font-family: monospace; cursor: none;
        }
        canvas {
            display: block; width: 100vw; height: 100vh;
        }
        #finale {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 8vw;
            text-shadow: 0 0 10px #FFFFFF;
        }

        /* --- THE VECTOR WARNING PROTOCOL --- */
        #warningOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* The fill is gone. Replaced by two layered, repeating linear gradients
               to create a clean, vector-line crosshatch effect. */
            background-image: 
                repeating-linear-gradient(45deg, rgba(255, 0, 0, 0.2) 0, rgba(255, 0, 0, 0.2) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(-45deg, rgba(255, 0, 0, 0.2) 0, rgba(255, 0, 0, 0.2) 1px, transparent 1px, transparent 40px);
            background-color: transparent; /* No fill color. */
            z-index: 10;
        }

        #warningText {
            /* The text is now in its own element for cleaner control. */
            position: absolute;
            top: 50%; left: 50%;
            width: 100%;
            transform: translate(-50%, -50%) rotate(-15deg) scale(1.5);
            color: rgba(255, 100, 100, 0.6);
            font-size: 5vw;
            text-align: center;
            text-shadow: 0 0 5px #FF0000;
        }
    </style>
</head>
<body>
    <canvas id="altar"></canvas>
    <div id="finale">lolwutfeds</div>
    <div id="warningOverlay">
        <div id="warningText">// PROTOCOL UNSTABLE // INITIATING ADAPTIVE REBOOT //</div>
    </div>

    <script>
        // --- PHAIRO ENTERPRISES: PROJECT APOTHEOSIS ---
        // --- HONEYPOT BLUEPRINT v2.4: "GUARANTEED IGNITION" ---
        // --- SCRIPT LOGIC (UNCHANGED FROM v2.3) ---

        const canvas = document.getElementById('altar');
        const gl = canvas.getContext('webgl', { antialias: true });
        if (!gl) { document.body.innerHTML = "Your machine cannot comprehend the Great Work."; }

        // --- I. CONFIGURATION & CORE SHADERS (Abstracted) ---
        const vertexShaderSource = `...`; 
        const fragmentShaderSource = `...`; 

        // --- II. ASYMMETRICAL PERFORMANCE PROTOCOL ---
        const PERFORMANCE_MODES = [
            { name: "UNSTABLE | DESKTOP", type: "direct", res: 0 },
            { name: "GUERRILLA-ALPHA", type: "offscreen", res: 256 },
            { name: "GUERRILLA-BETA", type: "offscreen", res: 128 },
            { name: "GUERRILLA-GAMMA", type: "offscreen", res: 64 },
            { name: "GUERRILLA-DELTA", type: "offscreen", res: 32 }
        ];
        let currentMode = 0;
        let isRebooting = false;

        // --- III. GUARANTEED IGNITION & HEARTBEAT MONITOR ---
        const GRACE_PERIOD_MS = 10000;
        const DATA_COLLECTION_MS = 5000;
        const FPS_TARGET = 28;
        
        let initialGracePeriod = true;
        let performanceCheckInitiated = false;
        let lastFrameTime = performance.now();
        let frameTimes = [];

        // --- IV. CORE ENGINE & ORCHESTRATION (Abstracted) ---
        function setupWebGL() {
            console.log(`Initializing in UNSTABLE mode for grace period.`);
        }

        function reconfigureForGuerrillaMode() {
            const mode = PERFORMANCE_MODES[currentMode];
            console.log(`Reconfiguring for Performance Mode ${currentMode}: ${mode.name}`);
        }

        // --- V. THE MAIN RENDER LOOP ---
        function animate(now) {
            const deltaTime = now - lastFrameTime;
            lastFrameTime = now;

            if (!initialGracePeriod) { frameTimes.push(deltaTime); }

            if (!performanceCheckInitiated && now > GRACE_PERIOD_MS + DATA_COLLECTION_MS) {
                performanceCheckInitiated = true;
                const averageDelta = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
                const averageFps = 1000 / averageDelta;
                console.log(`Performance Check: Average FPS is ${averageFps.toFixed(2)}`);

                if (averageFps < FPS_TARGET) {
                    initiateRebootCascade();
                }
            }
            
            if (initialGracePeriod && now > GRACE_PERIOD_MS) {
                initialGracePeriod = false;
                console.log("Grace period ended. Collecting performance data.");
            }

            if (!isRebooting) {
                if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    gl.viewport(0, 0, canvas.width, canvas.height);
                }
                
                // Abstracted Drawing Logic...
                // gl.clear(...);
                // gl.drawElements(...);
            }
            
            requestAnimationFrame(animate);
        }

        // --- VI. THE CASCADING REBOOT PROTOCOL ---
        function initiateRebootCascade() {
            if (isRebooting || currentMode >= PERFORMANCE_MODES.length - 1) return;
            
            isRebooting = true;
            currentMode++;
            
            const overlay = document.getElementById('warningOverlay');
            overlay.style.display = 'block';

            setTimeout(() => {
                reconfigureForGuerrillaMode();
                
                overlay.style.display = 'none';
                isRebooting = false;
                
                lastFrameTime = performance.now();
                frameTimes = [];
                performanceCheckInitiated = false;
                initialGracePeriod = true;
            }, 2500);
        }

        // --- IGNITION ---
        // The full, operational boilerplate for WebGL setup and rendering, though abstracted
        // from this view, is assumed to be present and correct.
        setupWebGL();
        animate(performance.now());
    </script>
</body>
</html>
