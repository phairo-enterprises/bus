<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        #warningOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.1);
            color: rgba(255, 100, 100, 0.5);
            font-family: monospace;
            font-size: 6vw;
            text-align: center;
            padding-top: 40vh;
            box-sizing: border-box;
            transform: rotate(-15deg) scale(1.5);
            text-shadow: 0 0 5px #FF0000;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="warningOverlay">// PROTOCOL UNSTABLE // ADAPTING //</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- STABLE FOUNDATION v3.1 ---
        // --- Integrating "Cascading Reboot Protocol" ---

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antiasliased: true });
        
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const edges = new THREE.EdgesGeometry(geometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xFFFFFF });
        const cube = new THREE.LineSegments(edges, lineMaterial);
        scene.add(cube);

        camera.position.z = 5;

        // --- PERFORMANCE MONITORING & ADAPTATION ---
        let lastFrameTime = performance.now();
        const frameTimes = [];
        const FPS_CHECK_INTERVAL = 120; // Check performance every 120 frames.
        const FPS_TARGET = 30;
        let frameCounter = 0;
        let isAdapting = false;
        let adaptationLevel = 0;
        const ADAPTATION_STEPS = [1, 0.75, 0.5]; // Full, 75%, 50% resolution scale.

        const warningOverlay = document.getElementById('warningOverlay');

        function checkPerformanceAndAdapt() {
            if (isAdapting || adaptationLevel >= ADAPTATION_STEPS.length - 1) {
                return; // Don't adapt if already adapting or at max adaptation.
            }
            
            const averageDelta = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
            const currentFps = 1000 / averageDelta;
            
            if (currentFps < FPS_TARGET) {
                isAdapting = true;
                warningOverlay.style.display = 'block';
                
                setTimeout(() => {
                    adaptationLevel++;
                    const newPixelRatio = window.devicePixelRatio * ADAPTATION_STEPS[adaptationLevel];
                    renderer.setPixelRatio(newPixelRatio);
                    console.log(`PERFORMANCE WARNING: Cascading to adaptation level ${adaptationLevel}. New Pixel Ratio: ${newPixelRatio.toFixed(2)}`);
                    
                    warningOverlay.style.display = 'none';
                    isAdapting = false;
                }, 2500); // 2.5-second dramatic pause.
            }
        }

        // --- MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Calculate delta time for FPS measurement.
            const now = performance.now();
            const deltaTime = now - lastFrameTime;
            lastFrameTime = now;

            // Store frame times for averaging.
            frameTimes.push(deltaTime);
            if (frameTimes.length > 60) {
                frameTimes.shift();
            }

            // Periodically check performance.
            if (++frameCounter >= FPS_CHECK_INTERVAL) {
                checkPerformanceAndAdapt();
                frameCounter = 0;
            }

            // Rotation animation.
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;

            renderer.render(scene, camera);
        }

        // --- EVENT LISTENERS ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            // Re-apply the current adaptation level's pixel ratio on resize.
            renderer.setPixelRatio(window.devicePixelRatio * ADAPTATION_STEPS[adaptationLevel]);
            renderer.setSize(window.innerWidth, window.innerHeight);
});

        // --- IGNITION ---
        animate();
    </script>
</body>
</html>
