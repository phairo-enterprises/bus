<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; touch-action: none; cursor: grab; }
        canvas.grabbing { cursor: grabbing; }
        canvas.hovering-ui { cursor: pointer; }
        #loadButton {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px; font-family: monospace; font-size: 20px;
            color: white; background-color: transparent; border: 1px solid white;
            cursor: pointer; z-index: 100; transition: opacity 0.5s;
        }
        #loadButton:hover { background-color: rgba(255, 255, 255, 0.1); }
        #warningOverlay {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background-color: rgba(255, 0, 0, 0.1);
            color: rgba(255, 100, 100, 0.5); font-family: monospace; font-size: 6vw;
            text-align: center; padding-top: 40vh; box-sizing: border-box;
            transform: rotate(-15deg) scale(1.5); text-shadow: 0 0 5px #FF0000;
            z-index: 10;
        }
        #consoleContainer {
            position: absolute; bottom: 10px; left: 10px;
            width: 450px; max-width: 90%;
            background-color: rgba(0, 20, 0, 0.5);
            border: 1px solid rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            font-family: monospace; font-size: 14px;
            color: lime;
            z-index: 200;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            pointer-events: none;
        }
        #consoleContainer.visible {
            opacity: 1;
            transform: translateY(0);
        }
        #consoleOutput {
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        #consoleOutput > div {
            margin-bottom: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <button id="loadButton">// ENGAGE DIAGNOSTIC v10.41 //</button>
    <div id="warningOverlay">// PROTOCOL UNSTABLE // ADAPTING //</div>
    <div id="consoleContainer">
        <div id="consoleOutput"></div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialiased: true });
        const BASE_FOV = 75;
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
        const clock = new THREE.Clock();
        
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 5;
        camera.rotation.order = 'YXZ';
        scene.add(camera);

        const artifactGroup = new THREE.Group();
        scene.add(artifactGroup);

        const uiGroup = new THREE.Group();
        camera.add(uiGroup);
        const freecamUiGroup = new THREE.Group();
        camera.add(freecamUiGroup);
        const touchUiGroup = new THREE.Group();
        camera.add(touchUiGroup);

        let advancedProtocolsLoaded = false;
        let cameraMode = 'bob';
        let FREECAM_SPEED = 5.0;
        let SENSITIVITY_LOOK = 0.002;
        let bodyMaterial, cubeWireframe;

        const ambientLight = new THREE.AmbientLight(0x404080, 2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xFF0000, 1.5, 50);
        artifactGroup.add(pointLight);
        
        bodyMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xFF0000, 
            transparent: true, 
            opacity: 0.1,
            depthWrite: false
        });
        const cubeBody = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), bodyMaterial);
        artifactGroup.add(cubeBody);
        cubeWireframe = new THREE.LineSegments(new THREE.EdgesGeometry(cubeBody.geometry), new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.5 }));
        artifactGroup.add(cubeWireframe);

        const caveGeometry = new THREE.BufferGeometry();
        const caveVertices = [];
        const radius = 20, depth = 50, segments = 12;
        for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            caveVertices.push(Math.cos(angle)*radius*(1+Math.random()*0.2), Math.sin(angle)*radius*(1+Math.random()*0.2), -depth/2 + (Math.random()-0.5)*5);
            caveVertices.push(Math.cos(angle)*radius*(1+Math.random()*0.2), Math.sin(angle)*radius*(1+Math.random()*0.2), depth/2 + (Math.random()-0.5)*5);
        }
        caveVertices.push(0, 0, depth / 2);
        const backCenterIndex = caveVertices.length / 3 - 1;
        const caveIndices = [];
        for (let i = 0; i < segments; i++) {
            const current = i * 2;
            const next = ((i + 1) % segments) * 2;
            caveIndices.push(current, current + 1, next);
            caveIndices.push(next, current + 1, next + 1);
            caveIndices.push(next + 1, current + 1, backCenterIndex);
        }
        caveGeometry.setIndex(caveIndices);
        caveGeometry.setAttribute('position', new THREE.Float32BufferAttribute(caveVertices, 3));
        caveGeometry.computeVertexNormals();
        const caveMaterial = new THREE.MeshStandardMaterial({ color: 0x223366, flatShading: true, side: THREE.BackSide });
        const cave = new THREE.Mesh(caveGeometry, caveMaterial);
        scene.add(cave);
        
        const consoleMessageQueue = [];
        let isConsoleLogging = false;

        function processConsoleQueue() {
            if (consoleMessageQueue.length === 0) { isConsoleLogging = false; return; }
            isConsoleLogging = true;
            const message = consoleMessageQueue.shift();
            const consoleDiv = document.getElementById('consoleOutput');
            const line = document.createElement('div');
            line.textContent = `> ${message}`;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            const delay = message.length > 30 ? 350 : 150;
            setTimeout(processConsoleQueue, delay);
        }

        function logToConsole(message) {
            consoleMessageQueue.push(message);
            if (!isConsoleLogging) { processConsoleQueue(); }
            console.log(message);
        }

        function createButton(name, labelText, position, size, targetGroup) {
            const button = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, 0.1), new THREE.MeshBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.8 }));
            button.position.set(position.x, position.y, 0);
            button.name = name;
            targetGroup.add(button);

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const font = '32px monospace';
            context.font = font;
            canvas.width = 128;
            canvas.height = 64; 
            context.font = font;
            context.fillStyle = 'rgba(200, 200, 200, 1)';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(labelText, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            const labelMaterial = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const labelGeometry = new THREE.PlaneGeometry(size.x * 0.9, size.y * 0.9);
            const labelMesh = new THREE.Mesh(labelGeometry, labelMaterial);
            labelMesh.position.z = 0.06;
            button.add(labelMesh);
            return button;
        }

        function createControlRow(param, labelText, yPos, targetGroup) {
            const xOffset = 0.9;
            const buttonSize = new THREE.Vector2(0.4, 0.4);
            createButton(`${param}_dec`, '-', new THREE.Vector3(xOffset, yPos, 0), buttonSize, targetGroup);
            createButton(`${param}_inc`, '+', new THREE.Vector3(xOffset + 0.6, yPos, 0), buttonSize, targetGroup);
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const font = '32px monospace';
            context.font = font;
            canvas.width = 200;
            canvas.height = 40; 
            context.font = font;
            context.fillStyle = 'rgba(200, 200, 200, 0.7)';
            context.textAlign = 'right';
            context.textBaseline = 'middle';
            context.fillText(labelText, canvas.width - 5, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            const labelMaterial = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const labelGeometry = new THREE.PlaneGeometry(canvas.width / 100, canvas.height / 100);
            const labelMesh = new THREE.Mesh(labelGeometry, labelMaterial);
            labelMesh.position.set(-0.5, yPos, 0);
            targetGroup.add(labelMesh);
        }

        function engageDiagnostic() {
            const loadButton = document.getElementById('loadButton');
            loadButton.style.opacity = '0';
            setTimeout(() => loadButton.remove(), 500);
            document.getElementById('consoleContainer').classList.add('visible');
            logToConsole('// CONSOLE BOOT SEQUENCE INITIATED //');
            advancedProtocolsLoaded = true;
            setTimeout(() => logToConsole('PERFORMANCE MONITOR: ACTIVE'), 250);
            setTimeout(() => logToConsole('SYSTEM MODE: DIAGNOSTIC'), 500);
            
            freecamUiGroup.visible = false;
            touchUiGroup.visible = false;

            let yPos = 1.6;
            const yStep = 0.5;
            createControlRow('scale', 'SCALE', yPos, uiGroup); yPos -= yStep;
            createControlRow('damping', 'DAMPING', yPos, uiGroup); yPos -= yStep;
            createControlRow('intensity', 'INTENSITY', yPos, uiGroup); yPos -= yStep;
            createControlRow('opacity', 'OPACITY', yPos, uiGroup); yPos -= yStep;
            createControlRow('red', 'RED', yPos, uiGroup); yPos -= yStep;
            createControlRow('green', 'GREEN', yPos, uiGroup); yPos -= yStep;
            createControlRow('blue', 'BLUE', yPos, uiGroup);

            yPos = 1.3;
            createControlRow('fov', 'FOV', yPos, freecamUiGroup); yPos -= yStep;
            createControlRow('speed', 'SPEED', yPos, freecamUiGroup); yPos -= yStep;
            createControlRow('sensitivity', 'SENSITIVITY', yPos, freecamUiGroup); yPos -= yStep;
            createControlRow('roll', 'ROLL', yPos, freecamUiGroup);

            const touchBtnSize = new THREE.Vector2(0.6, 0.6);
            createButton('touch_fwd', '^', new THREE.Vector3(0, 0.7, 0), touchBtnSize, touchUiGroup);
            createButton('touch_back', 'v', new THREE.Vector3(0, -0.7, 0), touchBtnSize, touchUiGroup);
            createButton('touch_left', '<', new THREE.Vector3(-0.7, 0, 0), touchBtnSize, touchUiGroup);
            createButton('touch_right', '>', new THREE.Vector3(0.7, 0, 0), touchBtnSize, touchUiGroup);
            createButton('touch_up', 'UP', new THREE.Vector3(0, 0, 0), touchBtnSize, touchUiGroup);
            createButton('touch_down', 'DN', new THREE.Vector3(0, -1.4, 0), touchBtnSize, touchUiGroup);

            setTimeout(() => logToConsole('UI PROTOCOLS: ENGAGED'), 750);
            setTimeout(() => logToConsole("PRESS 'C' TO TOGGLE FREECAM"), 1000);
        }
        document.getElementById('loadButton').addEventListener('click', engageDiagnostic);

        const raycaster = new THREE.Raycaster();
        let pressedButtons = {};
        let params = { damping: 0.95 };
        const rotationVelocity = { x: 0.001, y: 0.002 };
        const SENSITIVITY_DRAG = 0.004;

        const freecamState = { forward: 0, right: 0, up: 0 };
        const touchState = { forward: 0, right: 0, up: 0 };
        const activeTouches = {};
        
        const frameTimes = [];
        const FPS_CHECK_INTERVAL = 120;
        const FPS_TARGET = 30;
        let frameCounter = 0;
        let isAdapting = false;
        let adaptationLevel = 0;
        const ADAPTATION_STEPS = [1, 0.75, 0.5];
        const warningOverlay = document.getElementById('warningOverlay');

        function checkPerformanceAndAdapt() {
            if (isAdapting || adaptationLevel >= ADAPTATION_STEPS.length - 1) return;
            const averageDelta = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
            const currentFps = 1000 / averageDelta;
            if (currentFps < FPS_TARGET) {
                isAdapting = true;
                warningOverlay.style.display = 'block';
                logToConsole(`// PROTOCOL UNSTABLE // FPS: ${currentFps.toFixed(1)} // ADAPTING...`);
                setTimeout(() => {
                    adaptationLevel++;
                    onWindowResize();
                    warningOverlay.style.display = 'none';
                    isAdapting = false;
                    logToConsole(`// ADAPTATION COMPLETE // NEW RENDER SCALE: ${ADAPTATION_STEPS[adaptationLevel]}`);
                }, 2500);
            }
        }
        
        function updateAndLogParameter(param, action) {
            const step = action === 'inc' ? 1 : -1;
            const label = param.toUpperCase();
            let logMessage = "";
            switch(param) {
                case 'scale': artifactGroup.scale.setScalar(Math.max(0.1, artifactGroup.scale.x + step * 0.1)); logMessage = `// ${label} SET TO ${artifactGroup.scale.x.toFixed(2)} //`; break;
                case 'damping': params.damping = Math.max(0.8, Math.min(0.995, params.damping + step * 0.01)); logMessage = `// ${label} SET TO ${params.damping.toFixed(3)} //`; break;
                case 'intensity': pointLight.intensity = Math.max(0, pointLight.intensity + step * 0.2); logMessage = `// ${label} SET TO ${pointLight.intensity.toFixed(2)} //`; break;
                case 'opacity': bodyMaterial.opacity = Math.max(0, Math.min(1, bodyMaterial.opacity + step * 0.05)); cubeWireframe.material.opacity = bodyMaterial.opacity * 0.5 + 0.1; logMessage = `// ${label} SET TO ${bodyMaterial.opacity.toFixed(2)} //`; break;
                case 'red': pointLight.color.r = Math.max(0, Math.min(1, pointLight.color.r + step * 0.1)); bodyMaterial.color.r = pointLight.color.r; logMessage = `// ${label} SET TO ${pointLight.color.r.toFixed(2)} //`; break;
                case 'green': pointLight.color.g = Math.max(0, Math.min(1, pointLight.color.g + step * 0.1)); bodyMaterial.color.g = pointLight.color.g; logMessage = `// ${label} SET TO ${pointLight.color.g.toFixed(2)} //`; break;
                case 'blue': pointLight.color.b = Math.max(0, Math.min(1, pointLight.color.b + step * 0.1)); bodyMaterial.color.b = pointLight.color.b; logMessage = `// ${label} SET TO ${pointLight.color.b.toFixed(2)} //`; break;
                case 'fov': camera.fov = Math.max(30, Math.min(120, camera.fov + step * 5)); camera.updateProjectionMatrix(); logMessage = `// ${label} SET TO ${camera.fov.toFixed(1)} //`; break;
                case 'speed': FREECAM_SPEED = Math.max(1, Math.min(20, FREECAM_SPEED + step * 1)); logMessage = `// ${label} SET TO ${FREECAM_SPEED.toFixed(2)} //`; break;
                case 'sensitivity': SENSITIVITY_LOOK = Math.max(0.0005, Math.min(0.005, SENSITIVITY_LOOK + step * 0.0002)); logMessage = `// ${label} SET TO ${SENSITIVITY_LOOK.toFixed(4)} //`; break;
                case 'roll': camera.rotation.z = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, camera.rotation.z + step * 0.1)); logMessage = `// ${label} SET TO ${(camera.rotation.z / (Math.PI / 4) * 100).toFixed(0)}% //`; break;
            }
            if (logMessage) logToConsole(logMessage);
        }

        function handlePointerDown(event) {
            if (!advancedProtocolsLoaded) return;
            const pointer = new THREE.Vector2();
            
            const processTouch = (x, y, id) => {
                pointer.x = (x / window.innerWidth) * 2 - 1;
                pointer.y = - (y / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                
                let activeUiGroup = null;
                if (cameraMode === 'bob') activeUiGroup = uiGroup;
                else if (cameraMode === 'free') activeUiGroup = touchUiGroup.visible ? touchUiGroup : freecamUiGroup;
                
                const intersects = raycaster.intersectObjects(activeUiGroup.children, true);
                let buttonPressed = false;

                if (intersects.length > 0) {
                    const button = intersects[0].object.parent;
                    if (button && button.name) {
                        const [param, action] = button.name.split('_');
                        if (param && action) {
                            if (param.startsWith('touch')) {
                                updateTouchState(param.substring(5), 1);
                            } else {
                                updateAndLogParameter(param, action);
                            }
                            button.scale.set(0.9, 0.9, 0.9);
                            pressedButtons[id] = button;
                            buttonPressed = true;
                        }
                    }
                }
                
                if (id !== 'mouse') {
                    activeTouches[id] = { x, y, buttonPressed };
                } else if (!buttonPressed && cameraMode === 'bob') {
                    activeTouches.mouse = { x, y, buttonPressed: false };
                    renderer.domElement.classList.add('grabbing');
                } else if (!buttonPressed && cameraMode === 'free' && document.pointerLockElement !== renderer.domElement) {
                     renderer.domElement.requestPointerLock();
                }
            };
            
            if (event.type === 'mousedown') {
                 processTouch(event.clientX, event.clientY, 'mouse');
            } else {
                for (let i = 0; i < event.changedTouches.length; i++) {
                    const touch = event.changedTouches[i];
                    processTouch(touch.clientX, touch.clientY, touch.identifier);
                }
            }
        }

        function handlePointerMove(event) {
            const processMove = (x, y, id) => {
                const touch = activeTouches[id];
                if (!touch || touch.buttonPressed) return;

                const deltaX = x - touch.x;
                const deltaY = y - touch.y;

                if (cameraMode === 'bob') {
                    rotationVelocity.y += deltaX * SENSITIVITY_DRAG;
                    rotationVelocity.x += deltaY * SENSITIVITY_DRAG;
                }
                touch.x = x;
                touch.y = y;
            };

            if (event.type === 'mousemove' && activeTouches.mouse) {
                processMove(event.clientX, event.clientY, 'mouse');
            } else if (event.type === 'touchmove') {
                event.preventDefault();
                for (let i = 0; i < event.changedTouches.length; i++) {
                    const touch = event.changedTouches[i];
                    processMove(touch.clientX, touch.clientY, touch.identifier);
                }
            }
        }
        
        function handlePointerUp(event) {
             const processEnd = (id) => {
                if (pressedButtons[id]) {
                    const button = pressedButtons[id];
                    button.scale.set(1, 1, 1);
                    const [param] = button.name.split('_');
                    if(param.startsWith('touch')) {
                        updateTouchState(param.substring(5), 0);
                    }
                    delete pressedButtons[id];
                }
                delete activeTouches[id];
             };

            if (event.type === 'mouseup' || event.type === 'mouseleave') {
                processEnd('mouse');
                renderer.domElement.classList.remove('grabbing');
            } else {
                 for (let i = 0; i < event.changedTouches.length; i++) {
                    const touch = event.changedTouches[i];
                    processEnd(touch.identifier);
                }
            }
        }

        function updateTouchState(direction, value) {
            switch(direction) {
                case 'fwd': touchState.forward = value; break;
                case 'back': touchState.forward = -value; break;
                case 'left': touchState.right = -value; break;
                case 'right': touchState.right = value; break;
                case 'up': touchState.up = value; break;
                case 'down': touchState.up = -value; break;
            }
        }

        function onPointerLockChange() {
            if (document.pointerLockElement === renderer.domElement) {
                document.addEventListener('mousemove', onPointerLockMove);
            } else {
                document.removeEventListener('mousemove', onPointerLockMove);
                if (cameraMode === 'free') logToConsole('MOUSE LOOK DISENGAGED (ESC PRESSED)');
            }
        }

        function onPointerLockMove(event) {
            if (cameraMode !== 'free') return;
            const touchId = Object.keys(activeTouches).find(id => !activeTouches[id].buttonPressed);
            if (touchId) return; 

            camera.rotation.y -= event.movementX * SENSITIVITY_LOOK;
            camera.rotation.x -= event.movementY * SENSITIVITY_LOOK;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        }

        function onKeyPress(event) {
            if (event.key.toLowerCase() === 'c' && advancedProtocolsLoaded) {
                warningOverlay.style.display = 'none';
                if (cameraMode === 'bob') {
                    cameraMode = 'free';
                    logToConsole('CAMERA MODE: FREE (WASDQE, MOUSE LOOK, TOUCH)');
                    uiGroup.visible = false;
                    freecamUiGroup.visible = true;
                    touchUiGroup.visible = true;
                } else {
                    cameraMode = 'bob';
                    logToConsole('CAMERA MODE: BOB ENGAGED');
                    document.exitPointerLock();
                    camera.rotation.set(0, 0, 0);
                    uiGroup.visible = true;
                    freecamUiGroup.visible = false;
                    touchUiGroup.visible = false;
                }
            }
        }

        function onKey(event, isDown) {
            if (cameraMode !== 'free') return;
            const value = isDown ? 1 : 0;
            switch(event.key.toLowerCase()) {
                case 'w': freecamState.forward = value; break;
                case 's': freecamState.forward = -value; break;
                case 'a': freecamState.right = -value; break;
                case 'd': freecamState.right = value; break;
                case 'q': freecamState.up = -value; break;
                case 'e': freecamState.up = value; break;
            }
        }
        
        function updateUiPositions() {
            const zPos = -3.5;
            const h = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * Math.abs(zPos);
            const w = h * camera.aspect;
            uiGroup.position.set(-w + 2.5, 0, zPos);
            freecamUiGroup.position.set(w - 2.5, 0, zPos);

            const isMobile = window.innerWidth < 768;
            if (isMobile) {
                const dPadX = -w + 1.2;
                const dPadY = -h + 1.2;
                const actionX = w - 1.2;
                const actionY = -h + 1.2;
                
                touchUiGroup.getObjectByName('touch_fwd').position.set(dPadX, dPadY + 0.7, 0);
                touchUiGroup.getObjectByName('touch_back').position.set(dPadX, dPadY - 0.7, 0);
                touchUiGroup.getObjectByName('touch_left').position.set(dPadX - 0.7, dPadY, 0);
                touchUiGroup.getObjectByName('touch_right').position.set(dPadX + 0.7, dPadY, 0);
                
                touchUiGroup.getObjectByName('touch_up').position.set(actionX, actionY + 0.7, 0);
                touchUiGroup.getObjectByName('touch_down').position.set(actionX, actionY - 0.7, 0);
            }
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio * ADAPTATION_STEPS[adaptationLevel]);
            camera.aspect = width / height;
            
            if (camera.aspect < 1) {
                const horizontalFovInRadians = BASE_FOV * Math.PI / 180;
                camera.fov = 2 * Math.atan(Math.tan(horizontalFovInRadians / 2) / camera.aspect) * 180 / Math.PI;
            } else {
                camera.fov = BASE_FOV;
            }
            camera.updateProjectionMatrix();
            updateUiPositions();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            frameTimes.push(delta * 1000);
            if (frameTimes.length > 60) frameTimes.shift();
            if (advancedProtocolsLoaded && ++frameCounter >= FPS_CHECK_INTERVAL) checkPerformanceAndAdapt();

            if (cameraMode === 'bob') {
                camera.position.z = 5;
                camera.lookAt(0, 0, 0);
                
                artifactGroup.rotation.x += rotationVelocity.x;
                artifactGroup.rotation.y += rotationVelocity.y;
                rotationVelocity.x *= params.damping;
                rotationVelocity.y *= params.damping;
            } else if (cameraMode === 'free') {
                const totalForward = freecamState.forward + touchState.forward;
                const totalRight = freecamState.right + touchState.right;
                const totalUp = freecamState.up + touchState.up;

                const moveDirection = new THREE.Vector3(totalRight, 0, -totalForward);
                moveDirection.normalize();
                moveDirection.applyQuaternion(camera.quaternion);
                camera.position.addScaledVector(moveDirection, FREECAM_SPEED * delta);
                camera.position.y += totalUp * FREECAM_SPEED * delta;
            }
            
            renderer.render(scene, camera);
        }

        onWindowResize();
        renderer.domElement.addEventListener('mousedown', handlePointerDown);
        renderer.domElement.addEventListener('mousemove', handlePointerMove);
        renderer.domElement.addEventListener('mouseup', handlePointerUp);
        renderer.domElement.addEventListener('mouseleave', handlePointerUp);
        renderer.domElement.addEventListener('touchstart', handlePointerDown, { passive: false });
        renderer.domElement.addEventListener('touchmove', handlePointerMove, { passive: false });
        renderer.domElement.addEventListener('touchend', handlePointerUp);
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('keypress', onKeyPress);
        window.addEventListener('keydown', (e) => onKey(e, true));
        window.addEventListener('keyup', (e) => onKey(e, false));
        document.addEventListener('pointerlockchange', onPointerLockChange);
        animate();
    </script>
</body>
</html>
