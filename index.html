<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; touch-action: none; cursor: grab; }
        canvas.grabbing { cursor: grabbing; }
        canvas.hovering-ui { cursor: pointer; }
        #loadButton {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px; font-family: monospace; font-size: 20px;
            color: white; background-color: transparent; border: 1px solid white;
            cursor: pointer; z-index: 100; transition: opacity 0.5s;
        }
        #loadButton:hover { background-color: rgba(255, 255, 255, 0.1); }
        #warningOverlay {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background-color: rgba(255, 0, 0, 0.1);
            color: rgba(255, 100, 100, 0.5); font-family: monospace; font-size: 6vw;
            text-align: center; padding-top: 40vh; box-sizing: border-box;
            transform: rotate(-15deg) scale(1.5); text-shadow: 0 0 5px #FF0000;
            z-index: 10;
        }
        #consoleContainer {
            position: absolute; bottom: 10px; left: 10px;
            width: 450px; max-width: 90%;
            background-color: rgba(0, 20, 0, 0.5);
            border: 1px solid rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            font-family: monospace; font-size: 14px;
            color: lime;
            z-index: 200;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            pointer-events: none;
        }
        #consoleContainer.visible {
            opacity: 1;
            transform: translateY(0);
        }
        #consoleOutput {
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        #consoleOutput > div {
            margin-bottom: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <button id="loadButton">// ENGAGE DIAGNOSTIC v10.12 //</button>
    <div id="warningOverlay">// PROTOCOL UNSTABLE // ADAPTING //</div>
    <div id="consoleContainer">
        <div id="consoleOutput"></div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialiased: true });
        const BASE_FOV = 75;
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
        const clock = new THREE.Clock();
        
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 5;
        camera.rotation.order = 'YXZ';

        const artifactGroup = new THREE.Group();
        scene.add(artifactGroup);
        const bodyMaterial = new THREE.MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.1 });
        const cubeBody = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), bodyMaterial);
        artifactGroup.add(cubeBody);
        const cubeWireframe = new THREE.LineSegments(new THREE.EdgesGeometry(cubeBody.geometry), new THREE.LineBasicMaterial({ color: 0xFFFFFF }));
        artifactGroup.add(cubeWireframe);

        const params = { damping: 0.95 };
        const uiGroup = new THREE.Group();
        const freecamUiGroup = new THREE.Group();
        const touchUiGroup = new THREE.Group();
        scene.add(freecamUiGroup);
        camera.add(touchUiGroup);
        scene.add(camera);
        freecamUiGroup.visible = false;
        touchUiGroup.visible = false;

        let advancedProtocolsLoaded = false;
        let cameraMode = 'bob';
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        const ambientLight = new THREE.AmbientLight(0x404080, 2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00FFFF, 1.5, 50);
        artifactGroup.add(pointLight);

        const caveGeometry = new THREE.BufferGeometry();
        const caveVertices = [];
        const radius = 20, depth = 50, segments = 12;
        for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            caveVertices.push(Math.cos(angle)*radius*(1+Math.random()*0.2), Math.sin(angle)*radius*(1+Math.random()*0.2), -depth/2 + (Math.random()-0.5)*5);
            caveVertices.push(Math.cos(angle)*radius*(1+Math.random()*0.2), Math.sin(angle)*radius*(1+Math.random()*0.2), depth/2 + (Math.random()-0.5)*5);
        }
        caveVertices.push(0, 0, depth / 2);
        const backCenterIndex = caveVertices.length / 3 - 1;
        const caveIndices = [];
        for (let i = 0; i < segments; i++) {
            const current = i * 2;
            const next = ((i + 1) % segments) * 2;
            caveIndices.push(current, current + 1, next);
            caveIndices.push(next, current + 1, next + 1);
            caveIndices.push(next + 1, current + 1, backCenterIndex);
        }
        caveGeometry.setIndex(caveIndices);
        caveGeometry.setAttribute('position', new THREE.Float32BufferAttribute(caveVertices, 3));
        caveGeometry.computeVertexNormals();
        const caveMaterial = new THREE.MeshStandardMaterial({ color: 0x223366, flatShading: true, side: THREE.BackSide });
        const cave = new THREE.Mesh(caveGeometry, caveMaterial);
        scene.add(cave);
        
        const consoleMessageQueue = [];
        let isConsoleLogging = false;

        function processConsoleQueue() {
            if (consoleMessageQueue.length === 0) { isConsoleLogging = false; return; }
            isConsoleLogging = true;
            const message = consoleMessageQueue.shift();
            const consoleDiv = document.getElementById('consoleOutput');
            const line = document.createElement('div');
            line.textContent = `> ${message}`;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            const delay = message.length > 30 ? 350 : 150;
            setTimeout(processConsoleQueue, delay);
        }

        function logToConsole(message) {
            consoleMessageQueue.push(message);
            if (!isConsoleLogging) { processConsoleQueue(); }
            console.log(message);
        }

        function engageDiagnostic() {
            const loadButton = document.getElementById('loadButton');
            loadButton.style.opacity = '0';
            setTimeout(() => loadButton.remove(), 500);
            document.getElementById('consoleContainer').classList.add('visible');
            logToConsole('// CONSOLE BOOT SEQUENCE INITIATED //');
            if (isTouchDevice) logToConsole('TOUCH INTERFACE DETECTED');
            advancedProtocolsLoaded = true;
            setTimeout(() => logToConsole('PERFORMANCE MONITOR: ACTIVE'), 250);
            bodyMaterial.color.set(0xFF0000);
            pointLight.color.set(0xFF0000);
            setTimeout(() => logToConsole('SYSTEM MODE: DIAGNOSTIC'), 500);
            scene.add(uiGroup);
            const scaleSliderTrack = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0x333333 }));
            scaleSliderTrack.position.y = -2.5;
            uiGroup.add(scaleSliderTrack);
            const scaleSliderHandle = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xAAAAAA }));
            scaleSliderHandle.position.y = -2.5;
            scaleSliderHandle.name = "scaleSlider";
            uiGroup.add(scaleSliderHandle);
            const dampingSliderTrack = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0x333333 }));
            dampingSliderTrack.position.y = -3.0;
            uiGroup.add(dampingSliderTrack);
            const dampingSliderHandle = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xAAAAAA }));
            dampingSliderHandle.position.y = -3.0;
            dampingSliderHandle.name = "dampingSlider";
            uiGroup.add(dampingSliderHandle);
            const intensitySliderTrack = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0x333333 }));
            intensitySliderTrack.position.y = -3.5;
            uiGroup.add(intensitySliderTrack);
            const intensitySliderHandle = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xAAAAAA }));
            intensitySliderHandle.position.y = -3.5;
            intensitySliderHandle.name = "intensitySlider";
            uiGroup.add(intensitySliderHandle);
            
            const fovSliderTrack = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0x336633 }));
            fovSliderTrack.position.set(0, -2.5, -2);
            freecamUiGroup.add(fovSliderTrack);
            const fovSliderHandle = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xAAFFAA }));
            fovSliderHandle.position.set(0, -2.5, -2);
            fovSliderHandle.name = "fovSlider";
            freecamUiGroup.add(fovSliderHandle);
            
            const joystickBase = new THREE.Mesh(new THREE.CircleGeometry(0.7, 32), new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.2 }));
            joystickBase.name = "joystickBase";
            touchUiGroup.add(joystickBase);
            const joystickHandle = new THREE.Mesh(new THREE.CircleGeometry(0.3, 32), new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.5 }));
            joystickHandle.name = "joystickHandle";
            touchUiGroup.add(joystickHandle);

            setTimeout(() => logToConsole('UI PROTOCOLS: ENGAGED'), 750);
            setTimeout(() => logToConsole(isTouchDevice ? "TAP 'C' AREA OR PRESS 'C' TO TOGGLE FREECAM" : "PRESS 'C' TO TOGGLE FREECAM"), 1000);
        }
        document.getElementById('loadButton').addEventListener('click', engageDiagnostic);

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let selectedObject = null;
        let isDragging = false;
        const previousPointerPosition = { x: 0, y: 0 };
        const rotationVelocity = { x: 0, y: 0 };
        const SENSITIVITY_DRAG = 0.004;
        const SENSITIVITY_LOOK = 0.002;
        const FREECAM_SPEED = 5.0;
        const freecamState = { forward: 0, right: 0 };
        const touchState = {
            move: { id: -1, startX: 0, startY: 0, currentX: 0, currentY: 0 },
            look: { id: -1, lastX: 0, lastY: 0 }
        };
        
        const frameTimes = [];
        const FPS_CHECK_INTERVAL = 120;
        const FPS_TARGET = 30;
        let frameCounter = 0;
        let isAdapting = false;
        let adaptationLevel = 0;
        const ADAPTATION_STEPS = [1, 0.75, 0.5];
        const warningOverlay = document.getElementById('warningOverlay');

        function checkPerformanceAndAdapt() {
            if (isAdapting || adaptationLevel >= ADAPTATION_STEPS.length - 1) return;
            const averageDelta = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
            const currentFps = 1000 / averageDelta;
            if (currentFps < FPS_TARGET) {
                isAdapting = true;
                warningOverlay.style.display = 'block';
                logToConsole(`// PROTOCOL UNSTABLE // FPS: ${currentFps.toFixed(1)} // ADAPTING...`);
                setTimeout(() => {
                    adaptationLevel++;
                    onWindowResize();
                    warningOverlay.style.display = 'none';
                    isAdapting = false;
                    logToConsole(`// ADAPTATION COMPLETE // NEW RENDER SCALE: ${ADAPTATION_STEPS[adaptationLevel]}`);
                }, 2500);
            }
        }

        function onPointerDown(event) {
            const clientX = event.clientX || event.touches[0].clientX;
            const clientY = event.clientY || event.touches[0].clientY;
            pointer.x = (clientX / window.innerWidth) * 2 - 1;
            pointer.y = - (clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            let intersectableUIs = cameraMode === 'bob' ? uiGroup.children : freecamUiGroup.children;
            const intersects = raycaster.intersectObjects(intersectableUIs);
            if (advancedProtocolsLoaded && intersects.length > 0) {
                selectedObject = intersects[0].object;
                renderer.domElement.classList.add('grabbing');
            } else if (cameraMode === 'bob') {
                isDragging = true;
                renderer.domElement.classList.add('grabbing');
                previousPointerPosition.x = clientX;
                previousPointerPosition.y = clientY;
            } else if (cameraMode === 'free' && !isTouchDevice) {
                renderer.domElement.requestPointerLock();
            }
        }

        function onPointerMove(event) {
            if(event.touches && event.touches.length > 1) return;
            event.preventDefault();
            const clientX = event.clientX || (event.touches && event.touches[0] ? event.touches[0].clientX : previousPointerPosition.x);
            const clientY = event.clientY || (event.touches && event.touches[0] ? event.touches[0].clientY : previousPointerPosition.y);
            if (selectedObject) {
                pointer.x = (clientX / window.innerWidth) * 2 - 1;
                pointer.y = - (clientY / window.innerHeight) * 2 + 1;
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                raycaster.setFromCamera(pointer, camera);
                const intersectPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, intersectPoint);
                let newX = intersectPoint.x;
                newX = Math.max(-1.5, Math.min(1.5, newX));
                selectedObject.position.x = newX;
                if (selectedObject.name === "scaleSlider") artifactGroup.scale.setScalar(0.2 + ((newX + 1.5) / 3) * (2.5 - 0.2));
                else if (selectedObject.name === "dampingSlider") params.damping = 0.9 + ((newX + 1.5) / 3) * (0.995 - 0.9);
                else if (selectedObject.name === "intensitySlider") pointLight.intensity = ((newX + 1.5) / 3) * 4.0;
                else if (selectedObject.name === "fovSlider") {
                    camera.fov = 40 + ((newX + 1.5) / 3) * (120 - 40);
                    camera.updateProjectionMatrix();
                }
            } else if (isDragging && cameraMode === 'bob') {
                const deltaX = clientX - previousPointerPosition.x;
                const deltaY = clientY - previousPointerPosition.y;
                rotationVelocity.y += deltaX * SENSITIVITY_DRAG;
                rotationVelocity.x += deltaY * SENSITIVITY_DRAG;
                previousPointerPosition.x = clientX;
                previousPointerPosition.y = clientY;
            }
        }

        function onPointerUp() { 
            isDragging = false; 
            selectedObject = null;
            renderer.domElement.classList.remove('grabbing');
        }

        function onPointerLockChange() {
            if (document.pointerLockElement === renderer.domElement) document.addEventListener('mousemove', onPointerLockMove);
            else {
                document.removeEventListener('mousemove', onPointerLockMove);
                if (cameraMode === 'free' && !isTouchDevice) logToConsole('MOUSE LOOK DISENGAGED (ESC PRESSED)');
            }
        }

        function onPointerLockMove(event) {
            camera.rotation.y -= event.movementX * SENSITIVITY_LOOK;
            camera.rotation.x -= event.movementY * SENSITIVITY_LOOK;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        }
        
        function toggleFreecam() {
            if (!advancedProtocolsLoaded) return;
            if (cameraMode === 'bob') {
                cameraMode = 'free';
                logToConsole(isTouchDevice ? 'CAMERA MODE: FREE (TOUCH CONTROLS)' : 'CAMERA MODE: FREE (CLICK TO ENGAGE MOUSE LOOK)');
                uiGroup.visible = false;
                if (isTouchDevice) touchUiGroup.visible = true; else freecamUiGroup.visible = true;
            } else {
                cameraMode = 'bob';
                logToConsole('CAMERA MODE: BOB ENGAGED');
                uiGroup.visible = true;
                freecamUiGroup.visible = false;
                touchUiGroup.visible = false;
                if (!isTouchDevice) document.exitPointerLock();
            }
        }

        function onKeyPress(event) { if (event.key.toLowerCase() === 'c') toggleFreecam(); }
        function onKey(event, isDown) {
            if (cameraMode !== 'free' || isTouchDevice) return;
            const value = isDown ? 1 : 0;
            switch(event.key.toLowerCase()) {
                case 'w': freecamState.forward = value; break;
                case 's': freecamState.forward = -value; break;
                case 'a': freecamState.right = -value; break;
                case 'd': freecamState.right = value; break;
            }
        }

        function onTouchStart(event) {
            event.preventDefault();
            for (let i = 0; i < event.changedTouches.length; i++) {
                const touch = event.changedTouches[i];
                if (touch.clientX < window.innerWidth / 3 && touchState.move.id === -1) {
                    touchState.move.id = touch.identifier;
                    touchState.move.startX = touch.clientX;
                    touchState.move.startY = touch.clientY;
                } else if (touch.clientX > window.innerWidth / 2 && touchState.look.id === -1) {
                    touchState.look.id = touch.identifier;
                    touchState.look.lastX = touch.clientX;
                    touchState.look.lastY = touch.clientY;
                }
            }
        }

        function onTouchMove(event) {
            event.preventDefault();
            for (let i = 0; i < event.changedTouches.length; i++) {
                const touch = event.changedTouches[i];
                if (touch.identifier === touchState.move.id) {
                    const deltaX = touch.clientX - touchState.move.startX;
                    const deltaY = touch.clientY - touchState.move.startY;
                    const joystickHandle = touchUiGroup.getObjectByName("joystickHandle");
                    const dist = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
                    const maxDist = 50;
                    freecamState.right = Math.max(-1, Math.min(1, deltaX / maxDist));
                    freecamState.forward = Math.max(-1, Math.min(1, -deltaY / maxDist));
                    if (joystickHandle) {
                        const clampedDist = Math.min(dist, maxDist);
                        const angle = Math.atan2(deltaY, deltaX);
                        joystickHandle.position.x = joystickBase.position.x + Math.cos(angle) * (clampedDist / maxDist) * 0.4;
                        joystickHandle.position.y = joystickBase.position.y + Math.sin(angle) * (clampedDist / maxDist) * 0.4;
                    }
                } else if (touch.identifier === touchState.look.id) {
                    const deltaX = touch.clientX - touchState.look.lastX;
                    const deltaY = touch.clientY - touchState.look.lastY;
                    camera.rotation.y -= deltaX * SENSITIVITY_LOOK;
                    camera.rotation.x -= deltaY * SENSITIVITY_LOOK;
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                    touchState.look.lastX = touch.clientX;
                    touchState.look.lastY = touch.clientY;
                }
            }
        }

        function onTouchEnd(event) {
            event.preventDefault();
            for (let i = 0; i < event.changedTouches.length; i++) {
                const touch = event.changedTouches[i];
                if (touch.identifier === touchState.move.id) {
                    touchState.move.id = -1;
                    freecamState.forward = 0;
                    freecamState.right = 0;
                    const joystickHandle = touchUiGroup.getObjectByName("joystickHandle");
                    if (joystickHandle) joystickHandle.position.copy(touchUiGroup.getObjectByName("joystickBase").position);
                } else if (touch.identifier === touchState.look.id) {
                    touchState.look.id = -1;
                }
            }
        }
        
        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio * ADAPTATION_STEPS[adaptationLevel]);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            const fovSliderHandle = freecamUiGroup.getObjectByName("fovSlider");
            if (fovSliderHandle) {
                const fovRatio = (camera.fov - 40) / (120 - 40);
                fovSliderHandle.position.x = -1.5 + fovRatio * 3;
            }

            const h = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 5;
            const w = h * camera.aspect;
            const joystickBase = touchUiGroup.getObjectByName("joystickBase");
            const joystickHandle = touchUiGroup.getObjectByName("joystickHandle");
            if(joystickBase) {
                joystickBase.position.set(-w + 1, -h + 1, -5);
                joystickHandle.position.copy(joystickBase.position);
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            frameTimes.push(delta * 1000);
            if (frameTimes.length > 60) frameTimes.shift();
            if (advancedProtocolsLoaded && ++frameCounter >= FPS_CHECK_INTERVAL) checkPerformanceAndAdapt();

            if (cameraMode === 'bob') {
                camera.position.x = Math.sin(elapsedTime * 0.2) * 1.5;
                camera.position.y = Math.cos(elapsedTime * 0.3) * 1.0;
                camera.position.z = 5;
                camera.lookAt(0, 0, 0);
            } else if (cameraMode === 'free') {
                const moveDirection = new THREE.Vector3(freecamState.right, 0, -freecamState.forward);
                moveDirection.normalize();
                moveDirection.applyQuaternion(camera.quaternion);
                camera.position.addScaledVector(moveDirection, FREECAM_SPEED * delta);
            }
            
            artifactGroup.rotation.x += rotationVelocity.x;
            artifactGroup.rotation.y += rotationVelocity.y;
            if (!isDragging) {
                rotationVelocity.x *= params.damping;
                rotationVelocity.y *= params.damping;
            }
            
            renderer.render(scene, camera);
        }

        onWindowResize();
        renderer.domElement.addEventListener('mousedown', onPointerDown);
        renderer.domElement.addEventListener('mousemove', onPointerMove);
        renderer.domElement.addEventListener('mouseup', onPointerUp);
        renderer.domElement.addEventListener('mouseleave', onPointerUp);
        renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
        renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
        renderer.domElement.addEventListener('touchend', onTouchEnd, { passive: false });
        renderer.domElement.addEventListener('touchcancel', onTouchEnd, { passive: false });
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('keypress', onKeyPress);
        window.addEventListener('keydown', (e) => onKey(e, true));
        window.addEventListener('keyup', (e) => onKey(e, false));
        document.addEventListener('pointerlockchange', onPointerLockChange);
        animate();
    </script>
</body>
</html>
