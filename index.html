<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; touch-action: none; cursor: grab; }
        canvas.grabbing { cursor: grabbing; }
        canvas.hovering { cursor: pointer; }
    </style>
</head>
<body>
    <script>
        // --- STABLE FOUNDATION v9.1 (DIEGETIC UI: SCALE SLIDER) ---

        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialiased: true });
        const BASE_FOV = 75;
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
        const clock = new THREE.Clock();
        
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 5;

        const artifactGroup = new THREE.Group();
        scene.add(artifactGroup);
        const bodyMaterial = new THREE.MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.1 });
        const cubeBody = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), bodyMaterial);
        artifactGroup.add(cubeBody);
        const cubeWireframe = new THREE.LineSegments(new THREE.EdgesGeometry(cubeBody.geometry), new THREE.LineBasicMaterial({ color: 0xFFFFFF }));
        artifactGroup.add(cubeWireframe);

        // --- DIEGETIC UI ELEMENTS ---
        const uiGroup = new THREE.Group();
        scene.add(uiGroup);

        // Slider Track
        const sliderTrackGeo = new THREE.BoxGeometry(3, 0.1, 0.1);
        const sliderTrackMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const sliderTrack = new THREE.Mesh(sliderTrackGeo, sliderTrackMat);
        sliderTrack.position.y = -2.5;
        uiGroup.add(sliderTrack);

        // Slider Handle
        const sliderHandleGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const sliderHandleMat = new THREE.MeshBasicMaterial({ color: 0xAAAAAA });
        const sliderHandle = new THREE.Mesh(sliderHandleGeo, sliderHandleMat);
        sliderHandle.position.y = -2.5;
        sliderHandle.name = "scaleSlider"; // Name for raycasting
        uiGroup.add(sliderHandle);

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let selectedObject = null;

        function onPointerDown(event) {
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = - (event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(uiGroup.children);

            if (intersects.length > 0) {
                selectedObject = intersects[0].object;
            } else {
                isDragging = true;
                renderer.domElement.classList.add('grabbing');
                previousPointerPosition.x = event.clientX || event.touches[0].clientX;
                previousPointerPosition.y = event.clientY || event.touches[0].clientY;
            }
        }

        function onPointerMove(event) {
            if (selectedObject && selectedObject.name === "scaleSlider") {
                pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
                pointer.y = - (event.clientY / window.innerHeight) * 2 + 1;
                
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                raycaster.setFromCamera(pointer, camera);
                const intersectPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, intersectPoint);

                let newX = intersectPoint.x;
                newX = Math.max(-1.5, Math.min(1.5, newX)); // Clamp to track bounds
                sliderHandle.position.x = newX;

                const scaleValue = 0.2 + ((newX + 1.5) / 3) * (2.5 - 0.2); // Map position to scale
                artifactGroup.scale.set(scaleValue, scaleValue, scaleValue);

            } else if (isDragging) {
                if(event.touches && event.touches.length > 1) return;
                event.preventDefault();
                const clientX = event.clientX || event.touches[0].clientX;
                const clientY = event.clientY || event.touches[0].clientY;
                const deltaX = clientX - previousPointerPosition.x;
                const deltaY = clientY - previousPointerPosition.y;
                rotationVelocity.y += deltaX * SENSITIVITY;
                rotationVelocity.x += deltaY * SENSITIVITY;
                previousPointerPosition.x = clientX;
                previousPointerPosition.y = clientY;
            }
        }

        function onPointerUp() { 
            isDragging = false; 
            selectedObject = null;
            renderer.domElement.classList.remove('grabbing');
        }
        
        let isDragging = false;
        const previousPointerPosition = { x: 0, y: 0 };
        const rotationVelocity = { x: 0, y: 0 };
        const DAMPING_FACTOR = 0.95;
        const SENSITIVITY = 0.004;
        
        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            camera.aspect = width / height;
            if (camera.aspect < 1) {
                const horizontalFovInRadians = BASE_FOV * Math.PI / 180;
                camera.fov = 2 * Math.atan(Math.tan(horizontalFovInRadians / 2) / camera.aspect) * 180 / Math.PI;
            } else {
                camera.fov = BASE_FOV;
            }
            camera.updateProjectionMatrix();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            artifactGroup.rotation.x += rotationVelocity.x;
            artifactGroup.rotation.y += rotationVelocity.y;
            if (!isDragging) {
                rotationVelocity.x *= DAMPING_FACTOR;
                rotationVelocity.y *= DAMPING_FACTOR;
            }
            
            renderer.render(scene, camera);
        }

        onWindowResize();
        renderer.domElement.addEventListener('mousedown', onPointerDown);
        renderer.domElement.addEventListener('mousemove', onPointerMove);
        renderer.domElement.addEventListener('mouseup', onPointerUp);
        renderer.domElement.addEventListener('mouseleave', onPointerUp);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: false });
        renderer.domElement.addEventListener('touchmove', onPointerMove, { passive: false });
        renderer.domElement.addEventListener('touchend', onPointerUp);
        window.addEventListener('resize', onWindowResize);
        animate();
    </script>
</body>
</html>
