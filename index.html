<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
            touch-action: none;
            cursor: grab;
        }
        canvas.grabbing {
            cursor: grabbing;
        }
        canvas.freecam-active {
            cursor: crosshair;
        }
        #warningOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.1);
            color: rgba(255, 100, 100, 0.5);
            font-family: monospace;
            font-size: 6vw;
            text-align: center;
            padding-top: 40vh;
            box-sizing: border-box;
            transform: rotate(-15deg) scale(1.5);
            text-shadow: 0 0 5px #FF0000;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="warningOverlay">// PROTOCOL UNSTABLE // ADAPTING //</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lil-gui/0.17.0/lil-gui.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- ARCHITECTURE v4.0: MODULAR & DELAYED INITIALIZATION ---

        // --- 1. GLOBALLY SCOPED CORE OBJECTS ---
        // These are the bridges between the core module and the advanced module.
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialiased: true });
        const BASE_FOV = 75;
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 100);
        const clock = new THREE.Clock();
        const artifactGroup = new THREE.Group();
        
        // Shared state that both modules can read/write.
        const sharedState = {
            params: { damping: 0.95, freecam: false, freecamSpeed: 5.0 },
            rotationVelocity: { x: 0, y: 0 },
            isDragging: false,
        };

        // --- 2. CORE EXPERIENCE MODULE ---
        // This function sets up the guaranteed, stable part of the experience.
        // It runs immediately on page load.
        function initCoreExperience() {
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            camera.position.z = 5;

            const ambientLight = new THREE.AmbientLight(0x404080, 2);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x00FFFF, 1.5, 50);

            scene.add(artifactGroup);
            const bodyGeometry = new THREE.BoxGeometry(2, 2, 2);
            const bodyMaterial = new THREE.MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.1 });
            const cubeBody = new THREE.Mesh(bodyGeometry, bodyMaterial);
            artifactGroup.add(cubeBody);
            const edges = new THREE.EdgesGeometry(bodyGeometry);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xFFFFFF });
            const cubeWireframe = new THREE.LineSegments(edges, lineMaterial);
            artifactGroup.add(cubeWireframe);
            artifactGroup.add(pointLight);

            const caveGeometry = new THREE.BufferGeometry();
            const vertices = [];
            const radius = 20, depth = 50, segments = 12;
            for (let i = 0; i < segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                vertices.push(Math.cos(angle)*radius*(1+Math.random()*0.2), Math.sin(angle)*radius*(1+Math.random()*0.2),-depth/2+(Math.random()-0.5)*5);
                vertices.push(Math.cos(angle)*radius*(1+Math.random()*0.2), Math.sin(angle)*radius*(1+Math.random()*0.2),depth/2+(Math.random()-0.5)*5);
            }
            vertices.push(0, 0, depth/2);
            const backCenterIndex = vertices.length / 3 - 1;
            const indices = [];
            for (let i = 0; i < segments; i++) {
                const current = i * 2, next = ((i + 1) % segments) * 2;
                indices.push(current, current + 1, next);
                indices.push(next, current + 1, next + 1);
                indices.push(next + 1, current + 1, backCenterIndex);
            }
            caveGeometry.setIndex(indices);
            caveGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            caveGeometry.computeVertexNormals();
            const caveMaterial = new THREE.MeshStandardMaterial({ color: 0x223366, flatShading: true, side: THREE.BackSide });
            const cave = new THREE.Mesh(caveGeometry, caveMaterial);
            scene.add(cave);

            const previousPointerPosition = { x: 0, y: 0 };
            const SENSITIVITY = 0.004;
            function onCorePointerDown(event) {
                if (sharedState.params.freecam) return;
                sharedState.isDragging = true;
                renderer.domElement.classList.add('grabbing');
                previousPointerPosition.x = event.clientX || event.touches[0].clientX;
                previousPointerPosition.y = event.clientY || event.touches[0].clientY;
            }
            function onCorePointerMove(event) {
                if(event.touches && event.touches.length > 1) return;
                event.preventDefault();
                if (sharedState.isDragging && !sharedState.params.freecam) {
                    const clientX = event.clientX || event.touches[0].clientX;
                    const clientY = event.clientY || event.touches[0].clientY;
                    sharedState.rotationVelocity.y += (clientX - previousPointerPosition.x) * SENSITIVITY;
                    sharedState.rotationVelocity.x += (clientY - previousPointerPosition.y) * SENSITIVITY;
                    previousPointerPosition.x = clientX;
                    previousPointerPosition.y = clientY;
                }
            }
            function onCorePointerUp() {
                sharedState.isDragging = false;
                renderer.domElement.classList.remove('grabbing');
            }
            renderer.domElement.addEventListener('mousedown', onCorePointerDown);
            renderer.domElement.addEventListener('mousemove', onCorePointerMove);
            renderer.domElement.addEventListener('mouseup', onCorePointerUp);
            renderer.domElement.addEventListener('mouseleave', onCorePointerUp);
            renderer.domElement.addEventListener('touchstart', onCorePointerDown, { passive: false });
            renderer.domElement.addEventListener('touchmove', onCorePointerMove, { passive: false });
            renderer.domElement.addEventListener('touchend', onCorePointerUp);
        }

        // --- 3. ADVANCED FEATURES MODULE ---
        // This function is called after a delay. It adds the complex UI and controls.
        // It is designed to be a non-critical "addon."
        function initAdvancedFeatures() {
            const gui = new lil.GUI();
            Object.assign(sharedState.params, {
                scale: 1.0, lightIntensity: 1.5, color: '#00ffff'
            });

            const artifactFolder = gui.addFolder('Artifact Controls');
            artifactFolder.add(sharedState.params, 'scale', 0.2, 2.5).onChange(v => artifactGroup.scale.set(v, v, v));
            artifactFolder.add(sharedState.params, 'damping', 0.9, 0.995);
            artifactFolder.add(sharedState.params, 'lightIntensity', 0, 4.0).onChange(v => artifactGroup.children[2].intensity = v);
            artifactFolder.addColor(sharedState.params, 'color').onChange(v => {
                artifactGroup.children[2].color.set(v);
                artifactGroup.children[0].material.color.set(v);
            });

            const cameraFolder = gui.addFolder('Camera Controls');
            cameraFolder.add(sharedState.params, 'freecam').name('Freecam Mode').onChange(toggleFreecam);
            cameraFolder.add(camera, 'fov', 30, 120).onChange(() => camera.updateProjectionMatrix());
            cameraFolder.add(sharedState.params, 'freecamSpeed', 1, 20).name('Move Speed');
            cameraFolder.close();
            
            const keyState = {};
            const cameraDirection = new THREE.Vector3();
            function toggleFreecam(value) {
                if (value) renderer.domElement.requestPointerLock();
                else document.exitPointerLock();
            }
            document.addEventListener('pointerlockchange', () => {
                const isActive = document.pointerLockElement === renderer.domElement;
                sharedState.params.freecam = isActive;
                renderer.domElement.classList.toggle('freecam-active', isActive);
                gui.controllers.forEach(c => { if(c.property === 'freecam') c.updateDisplay(); });
            });
            document.addEventListener('keydown', (e) => keyState[e.code] = true);
            document.addEventListener('keyup', (e) => keyState[e.code] = false);
            
            function onFreecamMouseMove(event) {
                if (!sharedState.params.freecam) return;
                camera.rotation.y -= event.movementX * 0.002;
                camera.rotation.x -= event.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
            renderer.domElement.addEventListener('mousemove', onFreecamMouseMove);
            
            // This function is now attached to the shared state for the animate loop.
            sharedState.updateFreecamPosition = function(deltaTime) {
                const moveSpeed = sharedState.params.freecamSpeed * deltaTime;
                camera.getWorldDirection(cameraDirection);
                if (keyState['KeyW'] || keyState['ArrowUp']) camera.position.addScaledVector(cameraDirection, moveSpeed);
                if (keyState['KeyS'] || keyState['ArrowDown']) camera.position.addScaledVector(cameraDirection, -moveSpeed);
                if (keyState['KeyA'] || keyState['ArrowLeft']) camera.position.addScaledVector(cameraDirection.cross(camera.up).normalize(), -moveSpeed);
                if (keyState['KeyD'] || keyState['ArrowRight']) camera.position.addScaledVector(cameraDirection.cross(camera.up).normalize(), moveSpeed);
                if (keyState['KeyE']) camera.position.y += moveSpeed;
                if (keyState['KeyQ']) camera.position.y -= moveSpeed;
            }
        }

        // --- 4. UNIVERSAL ANIMATION LOOP & IGNITION ---
        function onWindowResize() {
            const width = window.innerWidth, height = window.innerHeight, aspect = width / height;
            renderer.setSize(width, height);
            camera.aspect = aspect;
            if (aspect < 1) {
                camera.fov = 2 * Math.atan(Math.tan(BASE_FOV * Math.PI / 180 / 2) / aspect) * 180 / Math.PI;
            } else {
                camera.fov = BASE_FOV;
            }
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', onWindowResize);
        
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (sharedState.params.freecam && sharedState.updateFreecamPosition) {
                sharedState.updateFreecamPosition(deltaTime);
            } else {
                camera.position.x = Math.sin(elapsedTime * 0.2) * 1.5;
                camera.position.y = Math.cos(elapsedTime * 0.3) * 1.0;
                camera.position.z = 5;
                camera.lookAt(0, 0, 0);
            }

            artifactGroup.rotation.x += sharedState.rotationVelocity.x;
            artifactGroup.rotation.y += sharedState.rotationVelocity.y;
            if (!sharedState.isDragging) {
                sharedState.rotationVelocity.x *= sharedState.params.damping;
                sharedState.rotationVelocity.y *= sharedState.params.damping;
            }
            
            renderer.render(scene, camera);
        }

        initCoreExperience();
        camera.rotation.order = 'YXZ';
        onWindowResize();
        animate();
        
        // The delayed ignition for the advanced features.
        setTimeout(initAdvancedFeatures, 10000);
    </script>
</body>
</html>
