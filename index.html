<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
            touch-action: none; /* Prevents pull-to-refresh and other default touch gestures */
            cursor: grab;
        }
        canvas.grabbing, canvas.freecam-active {
            cursor: grabbing;
        }
        canvas.freecam-active {
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div id="warningOverlay">// PROTOCOL UNSTABLE // ADAPTING //</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lil-gui/0.17.0/lil-gui.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialiased: true });
        const BASE_FOV = 75;
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 100);
        const clock = new THREE.Clock();
        
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const ambientLight = new THREE.AmbientLight(0x404080, 2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00FFFF, 1.5, 50);
        scene.add(pointLight);
        
        const caveGeometry = new THREE.BufferGeometry();
        const caveVertices = [];
        const radius = 20, depth = 50, segments = 12;
        for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            caveVertices.push(
                Math.cos(angle) * radius * (1 + Math.random() * 0.2),
                Math.sin(angle) * radius * (1 + Math.random() * 0.2),
                -depth / 2 + (Math.random() - 0.5) * 5
            );
            caveVertices.push(
                Math.cos(angle) * radius * (1 + Math.random() * 0.2),
                Math.sin(angle) * radius * (1 + Math.random() * 0.2),
                depth / 2 + (Math.random() - 0.5) * 5
            );
        }
        caveVertices.push(0, 0, depth / 2);
        const backCenterIndex = caveVertices.length / 3 - 1;
        const caveIndices = [];
        for (let i = 0; i < segments; i++) {
            const current = i * 2;
            const next = ((i + 1) % segments) * 2;
            caveIndices.push(current, current + 1, next);
            caveIndices.push(next, current + 1, next + 1);
            caveIndices.push(next + 1, current + 1, backCenterIndex);
        }
        caveGeometry.setIndex(caveIndices);
        caveGeometry.setAttribute('position', new THREE.Float32BufferAttribute(caveVertices, 3));
        caveGeometry.computeVertexNormals();
        const caveMaterial = new THREE.MeshStandardMaterial({
            color: 0x223366,
            flatShading: true,
            side: THREE.BackSide
        });
        const cave = new THREE.Mesh(caveGeometry, caveMaterial);
        scene.add(cave);
        
        const artifactGroup = new THREE.Group();
        scene.add(artifactGroup);
        const bodyMaterial = new THREE.MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.15 });
        const cubeBody = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), bodyMaterial);
        artifactGroup.add(cubeBody);
        const cubeWireframe = new THREE.LineSegments(new THREE.EdgesGeometry(cubeBody.geometry), new THREE.LineBasicMaterial({ color: 0xFFFFFF }));
        artifactGroup.add(cubeWireframe);
        artifactGroup.add(pointLight);

        const gui = new lil.GUI();
        const params = {
            scale: 1.0,
            damping: 0.95,
            lightIntensity: 1.5,
            color: '#00ffff',
            freecam: false,
            freecamSpeed: 5.0,
        };

        const artifactFolder = gui.addFolder('Artifact Controls');
        artifactFolder.add(params, 'scale', 0.2, 2.5).name('Scale').onChange(v => artifactGroup.scale.set(v, v, v));
        artifactFolder.add(params, 'damping', 0.9, 0.995).name('Inertia Damping');
        artifactFolder.add(params, 'lightIntensity', 0, 4.0).name('Glow Intensity').onChange(v => pointLight.intensity = v);
        artifactFolder.addColor(params, 'color').name('Glow Color').onChange(v => {
            pointLight.color.set(v);
            bodyMaterial.color.set(v);
        });

        const cameraFolder = gui.addFolder('Camera Controls');
        cameraFolder.add(params, 'freecam').name('Freecam Mode').onChange(toggleFreecam);
        cameraFolder.add(camera, 'fov', 30, 120).name('Field of View').onChange(() => camera.updateProjectionMatrix());
        cameraFolder.add(params, 'freecamSpeed', 1, 20).name('Move Speed');
        cameraFolder.close();
        
        if (window.innerWidth < 768) {
            gui.width = 250;
            gui.controllers.forEach(c => c.title.style.whiteSpace = 'nowrap');
        }

        const keyState = {};
        const cameraDirection = new THREE.Vector3();
        
        function toggleFreecam(value) {
            if (value) {
                renderer.domElement.requestPointerLock();
            } else {
                document.exitPointerLock();
            }
        }

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== renderer.domElement) {
                params.freecam = false;
                gui.controllers.forEach(c => { if(c.property === 'freecam') c.updateDisplay(); });
                renderer.domElement.classList.remove('freecam-active');
            } else {
                renderer.domElement.classList.add('freecam-active');
            }
        });
        
        document.addEventListener('keydown', (e) => keyState[e.code] = true);
        document.addEventListener('keyup', (e) => keyState[e.code] = false);

        function onFreecamMouseMove(event) {
            if (!params.freecam) return;
            camera.rotation.y -= event.movementX * 0.002;
            camera.rotation.x -= event.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        }
        
        function updateFreecamPosition(deltaTime) {
            const moveSpeed = params.freecamSpeed * deltaTime;
            camera.getWorldDirection(cameraDirection);
            if (keyState['KeyW'] || keyState['ArrowUp']) camera.position.addScaledVector(cameraDirection, moveSpeed);
            if (keyState['KeyS'] || keyState['ArrowDown']) camera.position.addScaledVector(cameraDirection, -moveSpeed);
            if (keyState['KeyA'] || keyState['ArrowLeft']) camera.position.addScaledVector(cameraDirection.cross(camera.up).normalize(), -moveSpeed);
            if (keyState['KeyD'] || keyState['ArrowRight']) camera.position.addScaledVector(cameraDirection.cross(camera.up).normalize(), moveSpeed);
            if (keyState['KeyE']) camera.position.y += moveSpeed;
            if (keyState['KeyQ']) camera.position.y -= moveSpeed;
        }
        
        let isDragging = false;
        const previousPointerPosition = { x: 0, y: 0 };
        const rotationVelocity = { x: 0, y: 0 };
        const SENSITIVITY = 0.01;

        function onPointerDown(event) {
            if (params.freecam) return;
            isDragging = true;
            renderer.domElement.classList.add('grabbing');
            previousPointerPosition.x = event.clientX || event.touches[0].clientX;
            previousPointerPosition.y = event.clientY || event.touches[0].clientY;
        }
        function onPointerMove(event) {
            if(event.touches && event.touches.length > 1) return; // Ignore pinch-zoom gestures
            event.preventDefault();
            if (isDragging && !params.freecam) {
                const clientX = event.clientX || event.touches[0].clientX;
                const clientY = event.clientY || event.touches[0].clientY;
                rotationVelocity.y += (clientX - previousPointerPosition.x) * SENSITIVITY;
                rotationVelocity.x += (clientY - previousPointerPosition.y) * SENSITIVITY;
                previousPointerPosition.x = clientX;
                previousPointerPosition.y = clientY;
            }
        }
        function onPointerUp() {
            isDragging = false;
            renderer.domElement.classList.remove('grabbing');
        }
        
        renderer.domElement.addEventListener('mousedown', onPointerDown);
        renderer.domElement.addEventListener('mousemove', onPointerMove);
        renderer.domElement.addEventListener('mouseup', onPointerUp);
        renderer.domElement.addEventListener('mouseleave', onPointerUp);
        renderer.domElement.addEventListener('touchstart', onPointerDown);
        renderer.domElement.addEventListener('touchmove', onPointerMove);
        renderer.domElement.addEventListener('touchend', onPointerUp);
        renderer.domElement.addEventListener('mousemove', onFreecamMouseMove);
        
        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            if (camera.aspect < 1) {
                camera.fov = 2 * Math.atan(Math.tan(BASE_FOV * Math.PI / 180 / 2) / camera.aspect) * 180 / Math.PI;
            } else {
                camera.fov = BASE_FOV;
            }
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', onWindowResize);
        
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (params.freecam) {
                updateFreecamPosition(deltaTime);
            } else {
                camera.position.x = Math.sin(elapsedTime * 0.2) * 1.5;
                camera.position.y = Math.cos(elapsedTime * 0.3) * 1.0;
                camera.position.z = 5;
                camera.lookAt(0, 0, 0);
            }

            artifactGroup.rotation.x += rotationVelocity.x;
            artifactGroup.rotation.y += rotationVelocity.y;
            if (!isDragging) {
                rotationVelocity.x *= params.damping;
                rotationVelocity.y *= params.damping;
            }
            
            renderer.render(scene, camera);
        }

        camera.rotation.order = 'YXZ';
        onWindowResize();
        animate();
    </script>
</body>
</html>
