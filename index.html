<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        #warningOverlay {
            /* Styles for the performance warning overlay */
        }
    </style>
</head>
<body>
    <div id="warningOverlay">// PROTOCOL UNSTABLE // ADAPTING //</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- STABLE FOUNDATION v3.3 ---
        // --- Integrating Low-Poly Environment & Camera Animation ---

        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialiased: true });
        
        // The camera's far clipping plane is increased to ensure it can see the back of the cave.
        const BASE_FOV = 75; 
        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;

        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING SETUP ---
        // A soft ambient light to illuminate the cave.
        const ambientLight = new THREE.AmbientLight(0x404080, 2); // Dim blueish light
        scene.add(ambientLight);
        // A point light inside the cube to make it "glow" and cast light on the cave walls.
        const pointLight = new THREE.PointLight(0xFFFFFF, 1.5, 50);
        scene.add(pointLight);

        // --- CENTRAL ARTIFACT (The Cube) ---
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const edges = new THREE.EdgesGeometry(geometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xFFFFFF });
        const cube = new THREE.LineSegments(edges, lineMaterial);
        scene.add(cube);
        // Add the point light as a child of the cube so it moves with it.
        cube.add(pointLight);


        // --- ICE CAVE ENVIRONMENT ---
        // We create a low-poly cave using BufferGeometry for maximum efficiency and control.
        const caveGeometry = new THREE.BufferGeometry();
        
        // Define vertices for a distorted, cylindrical cave shape.
        const vertices = [];
        const radius = 20;
        const depth = 50;
        const segments = 12; // Controls the number of wall faces

        for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            // Front ring of vertices with random jitter
            vertices.push(
                Math.cos(angle) * radius * (1 + Math.random() * 0.2),
                Math.sin(angle) * radius * (1 + Math.random() * 0.2),
                -depth / 2 + (Math.random() - 0.5) * 5
            );
            // Back ring of vertices
            vertices.push(
                Math.cos(angle) * radius * (1 + Math.random() * 0.2),
                Math.sin(angle) * radius * (1 + Math.random() * 0.2),
                depth / 2 + (Math.random() - 0.5) * 5
            );
        }
        // Add a center vertex for the back wall cap
        vertices.push(0, 0, depth / 2);
        const backCenterIndex = vertices.length / 3 - 1;

        // Define faces (indices)
        const indices = [];
        for (let i = 0; i < segments; i++) {
            const current = i * 2;
            const next = ((i + 1) % segments) * 2;
            // Wall panel (two triangles)
            indices.push(current, current + 1, next);
            indices.push(next, current + 1, next + 1);
            // Back wall cap triangle
            indices.push(next + 1, current + 1, backCenterIndex);
        }

        caveGeometry.setIndex(indices);
        caveGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        caveGeometry.computeVertexNormals(); // For correct lighting on the flat faces.

        const caveMaterial = new THREE.MeshStandardMaterial({
            color: 0x223366, // Deep ice blue
            flatShading: true,
            side: THREE.BackSide // Render the inside of the geometry
        });

        const cave = new THREE.Mesh(caveGeometry, caveMaterial);
        scene.add(cave);


        // --- PERFORMANCE MONITORING & RESPONSIVE CONTROLS (Unchanged) ---
        // ... (all previous code for performance checks, resizing, and pointer controls) ...
        const previousPointerPosition = { x: 0, y: 0 };
        const rotationVelocity = { x: 0, y: 0 };
        const DAMPING_FACTOR = 0.95;
        const SENSITIVITY = 0.01;
        let isDragging = false;
        // ... (event listeners as defined in the previous version) ...
        

        // --- MAIN ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // --- Gentle Camera Bob ---
            // A slow sine wave on the X and Y axes creates a smooth, floating drift.
            camera.position.x = Math.sin(elapsedTime * 0.2) * 1.5;
            camera.position.y = Math.cos(elapsedTime * 0.3) * 1.0;

            // Apply velocity to the cube's rotation.
            cube.rotation.x += rotationVelocity.x;
            cube.rotation.y += rotationVelocity.y;

            // Apply damping to the velocity if the user is not dragging.
            if (!isDragging) {
                rotationVelocity.x *= DAMPING_FACTOR;
                rotationVelocity.y *= DAMPING_FACTOR;
            }

            // ... (previous performance monitoring check would be here) ...

            renderer.render(scene, camera);
        }
        
        // --- EVENT LISTENERS & IGNITION (Unchanged from responsive version) ---
        // ... (add all pointer and resize event listeners as defined in the previous version) ...
        
        // --- Initial call to set everything up correctly ---
        // onWindowResize();
        animate();
    </script>
</body>
</html>
