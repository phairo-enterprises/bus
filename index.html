<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DaxOS [Shell] - v0.03</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
        }

        #nexus-canvas, #shell-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #shell-overlay {
            z-index: 100;
        }

        #immersion-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 255, 255, 0.7);
            font-family: monospace;
            font-size: 24px;
            cursor: pointer;
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1.0; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <canvas id="nexus-canvas"></canvas>
    <div id="shell-overlay">
        <div id="immersion-prompt">// INITIATE IMMERSION //</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const immersionPrompt = document.getElementById('immersion-prompt');
            if (immersionPrompt) {
                immersionPrompt.addEventListener('click', () => {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable fullscreen mode: ${err.message} (${err.name})`);
                    });
                });
            }
        });
    </script>
</body>
</html>
