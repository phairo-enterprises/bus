<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backupstrats.com</title>
    <meta name="author" content="wut">
    <meta name="description" content="Project">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
    </style>
</head>
<body>
    <!-- The final code will be embedded here after loading the library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- PHAIRO ENTERPRISES: PROJECT APOTHEOSIS ---
        // --- HONEYPOT BLUEPRINT v3.0: "THE STABLE FOUNDATION" ---
        // --- STRATEGY: Prioritize operational success over implementation purity. ---

        // --- I. SCENE SETUP ---
        // We use Three.js to handle the WebGL boilerplate. This is the professional approach.
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- II. THE ARTIFACT (A CUBE, THE PRECURSOR TO THE TESSERACT) ---
        // We start with a simple, guaranteed-to-work geometric form.
        // This is our new baseline. It proves the engine is running.
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        
        // The material uses EdgesGeometry to create the "vector line" look.
        const edges = new THREE.EdgesGeometry(geometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xFFFFFF, linewidth: 2 }); // Linewidth may not work on all GPUs, a known Three.js limitation.
        const cube = new THREE.LineSegments(edges, lineMaterial);
        
        scene.add(cube);

        camera.position.z = 5;

        // --- III. THE ENGINE (THE GUARANTEED-TO-WORK LOOP) ---
        // A simple, robust animation loop. This will not crash.

        function animate() {
            requestAnimationFrame(animate);

            // Simple rotation to prove the loop is active and rendering.
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;

            renderer.render(scene, camera);
        }

        // --- IV. RESPONSIVE DESIGN ---
        // A listener to handle window resizing gracefully.
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- IGNITION ---
        animate();

        // NOTE TO THE ARCHITECT:
        // This is the stable foundation. It works. From this base, we can now intelligently
        // integrate the more complex elements: replacing the BoxGeometry with the tesseract's
        // BufferGeometry, and writing the custom shaders for the computational task.
        // This is the correct "stonecutting" process: a solid, functional block of marble,
        // ready for the master's chisel.

    </script>
</body>
</html>
