<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102522"><title>Axiom Gauge · Backup Strats</title>
<style>
:root{font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:#182b26;background:#f3f4ec}*{box-sizing:border-box}body{margin:0}header,main{max-width:940px;margin:auto;padding:20px clamp(16px,4vw,46px)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #b7c2b6}a{color:inherit}h1{font-size:clamp(40px,8vw,78px);line-height:1;letter-spacing:-.06em;margin:20px 0}h2{font-size:1.35rem;margin:0 0 .35em}p{margin:.5em 0}.hero,.panel,details{padding:22px 0;border-bottom:1px solid #bcc8ba}.status{font:14px/1.6 ui-monospace,monospace;color:#315849}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.lens{padding:20px;background:#fffef8;border:1px solid #c4cec0;border-radius:8px}.score{font-size:1.4rem;color:#185648}ul{padding-left:20px}li{margin:.5em 0}small{color:#445a4e}form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px}select,input,button{font:inherit;padding:8px;border:1px solid #8c9e92;border-radius:5px}button{background:#193f34;color:white;cursor:pointer}summary{cursor:pointer;font-weight:650}.note{color:#99431d}footer{padding:20px 0}</style></head><body>
<header><a href="https://backupstrats.com/">Backup Strats</a><a href="https://playtest.backupstrats.com/">Hollow Soul playtest</a></header>
<main><section class="hero"><h1>Axiom Gauge</h1><h2 id="program">Hollow Soul</h2><p id="status" class="status" role="status">Opening checkpoint…</p><p id="hardware" class="status"></p></section>
<section class="panel"><h2>Assessment</h2><div class="grid" id="lenses"></div></section>
<section class="panel"><h2>Development decision</h2><p id="decision"></p><p id="next"></p></section>
<section class="panel"><h2>Local strawman</h2><p>Try a rating on this device. When a confirmed revision arrives, compatible local ratings carry forward. Corrections appear below.</p>
<form id="draft"><label>Phase<select id="phase"><option value="timely">Current</option><option value="timeless">Future</option></select></label><label>Dimension<select id="dim"><option>interface</option><option>functionality</option><option>programming</option><option>connectivity</option></select></label><label>Rating<select id="rating"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>Basis<input id="basis" required maxlength="500"></label><button>Apply locally</button></form><p id="pending"></p></section>
<details><summary>Correction history</summary><ul id="history"></ul></details><footer><small id="policy"></small></footer></main>
<script src="./model.js"></script><script type="module" src="./ui.mjs"></script></body></html>
